<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character — LZRV Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/player.css">
</head>
<body>

<!-- Loading screen -->
<div class="page-loader" id="loader">
  <span>LADE CHARAKTER</span>
  <div><span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span></div>
</div>

<nav class="nav" id="topNav" style="display:none">
  <img src="assets/img/logo.png" alt="LZRV Hub" class="nav-logo-img">
  <span id="navName" style="font-family:var(--font-display);font-size:.85rem;color:var(--red);margin-left:.75rem"></span>
  <a id="shopLink" href="#" class="btn btn-ghost" style="font-size:.75rem">Shop</a>
  <a href="index.html" class="btn btn-ghost" style="margin-left:auto;font-size:.75rem">← Übersicht</a>
</nav>

<!-- Combat Panel (combat active) -->
<div class="combat-panel" id="combatPanel" style="display:none">
  <div class="combat-panel-header">
    <span class="combat-panel-label">KAMPF — RUNDE <strong id="initRound">1</strong></span>
  </div>
  <div class="combat-combatants" id="combatCombatants"></div>
</div>

<!-- ── Character header ── -->
<header class="char-header" id="charHeader" style="display:none">
  <img id="charPortrait" class="char-portrait" src="" alt="Portrait">
  <div class="char-info">
    <div class="char-name" id="charName">—</div>
    <div class="char-sub" id="charSub">—</div>
    <div class="res-rows">
      <!-- HP -->
      <div class="res-row">
        <span class="res-label">HP</span>
        <div class="res-bar-wrap">
          <div class="res-track"><div class="res-fill hp" id="hpFill" style="width:0%"></div></div>
          <div class="res-controls">
            <button class="res-btn" data-res="hp" data-d="-1">−</button>
            <span class="res-cur" id="hpCur" contenteditable="true" data-res="hp">0</span>
            <span class="res-sep">/</span>
            <span class="res-max" id="hpMax">0</span>
            <button class="res-btn" data-res="hp" data-d="+1">+</button>
          </div>
        </div>
      </div>
      <!-- Humanity -->
      <div class="res-row">
        <span class="res-label">HUM</span>
        <div class="res-bar-wrap">
          <div class="res-track"><div class="res-fill hum" id="humFill" style="width:0%"></div></div>
          <div class="res-controls">
            <button class="res-btn" data-res="humanity" data-d="-1">−</button>
            <span class="res-cur" id="humCur" contenteditable="true" data-res="humanity">0</span>
            <span class="res-sep">/</span>
            <span class="res-max" id="humMax">0</span>
            <button class="res-btn" data-res="humanity" data-d="+1">+</button>
          </div>
        </div>
      </div>
      <!-- Luck dots -->
      <div class="luck-row">
        <span class="luck-label">LUCK</span>
        <div class="luck-dots" id="luckDots"></div>
        <span class="luck-count" id="luckCount"></span>
      </div>
    </div>
    <!-- Buff Bar -->
    <div class="buff-bar" id="buffBar" style="display:none">
      <div class="buff-bar-label">BUFFS</div>
      <div class="buff-list" id="buffList"></div>
    </div>
    <div class="condition-badges" id="conditionBadges"></div>
    <button class="death-save-btn" id="deathSaveBtn" style="display:none">☠ DEATH SAVE</button>
  </div>
  <div class="char-ip-badge" id="charIpBadge">
    <div class="char-ip-label">IP</div>
    <div class="char-ip-value" id="charIpValue">0</div>
  </div>
</header>

<!-- ── Tabs ── -->
<div class="tabs" id="tabBar" style="display:none">
  <button class="tab-btn active" data-tab="stats">Stats</button>
  <button class="tab-btn" data-tab="skills">Skills</button>
  <button class="tab-btn" data-tab="weapons">Weapons</button>
  <button class="tab-btn" data-tab="armor">Armor</button>
  <button class="tab-btn" data-tab="cyberware">Cyberware</button>
  <button class="tab-btn" data-tab="gear">Gear</button>
  <button class="tab-btn" data-tab="lifepath">Lifepath</button>
  <button class="tab-btn" data-tab="injuries">Injuries<span id="injuryBadge" class="injury-badge" hidden></span></button>
  <button class="tab-btn" data-tab="notes">Notes</button>
</div>

<!-- ── Tab panels ── -->
<div class="tab-panel active" id="tab-stats"></div>
<div class="tab-panel" id="tab-skills"></div>
<div class="tab-panel" id="tab-weapons"></div>
<div class="tab-panel" id="tab-armor"></div>
<div class="tab-panel" id="tab-cyberware"></div>
<div class="tab-panel" id="tab-gear"></div>
<div class="tab-panel" id="tab-lifepath"></div>
<div class="tab-panel" id="tab-injuries"></div>
<div class="tab-panel" id="tab-notes">
  <div class="notes-wrap">
    <div class="notes-header">Meine Notizen</div>
    <textarea id="playerNotesArea" class="player-notes-area" placeholder="Items gefunden, Quests, NPCs…"></textarea>
    <div class="notes-save-status" id="notesSaveStatus"></div>
  </div>
</div>
<!-- Floating Chat Panel -->
<div id="chatPanel" class="chat-panel">
  <div class="chat-panel-header">
    <span class="chat-panel-title">CHAT</span>
    <button id="chatPanelClose" class="chat-panel-close">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <textarea id="chatInput" class="chat-input" rows="2" placeholder="Nachricht…" maxlength="500"></textarea>
    <button id="chatSendBtn" class="chat-send-btn">↑</button>
  </div>
</div>
<button id="chatToggle" class="chat-toggle-btn">
  💬<span class="chat-unread-badge" id="chatUnreadBadge" style="display:none">0</span>
</button>

<!-- Critical Injury Modal -->
<div id="crit-modal" class="crit-modal-overlay" hidden>
  <div class="crit-modal-box" id="critModalBox"></div>
</div>

<!-- Item tooltip -->
<div id="item-tooltip" class="item-tooltip" hidden></div>

<!-- Dice-box 3D canvas (hidden, mounted by dice-box lib) -->
<div id="dice-canvas-placeholder" style="position:fixed;inset:0;pointer-events:none;z-index:900"></div>

<!-- ── Dice ── -->
<button class="dice-fab" id="diceFab" style="display:none" title="Würfeln">🎲</button>

<div class="dice-popup" id="dicePopup">
  <div class="dice-popup-head">
    <span>WÜRFELN</span>
    <button class="dice-popup-close" id="diceClose">✕</button>
  </div>
  <div class="dice-quick">
    <button class="die-btn" data-expr="1d6">d6</button>
    <button class="die-btn" data-expr="1d10">d10</button>
    <button class="die-btn" data-expr="2d6">2d6</button>
    <button class="die-btn" data-expr="3d6">3d6</button>
    <button class="die-btn skill-check" data-expr="1d10">d10★</button>
  </div>
  <div class="dice-custom">
    <input type="text" id="diceExpr" placeholder="z.B. 1d10+5" spellcheck="false">
    <button id="diceRollBtn">Roll</button>
  </div>
  <div class="dice-result-area" id="diceResultArea">
    <div class="dice-result-num" id="diceResultNum">—</div>
    <div class="dice-result-detail" id="diceResultDetail"></div>
  </div>
  <div class="dice-log" id="diceLog"></div>
</div>

<div class="roll-toast" id="rollToast"></div>

<script type="module">
console.log('[player] module loaded');
import { getCharacter, getCharacters, patchCharacter, logRoll, getActiveCombat, subscribeCombat, subscribeCharacters, sendMessage, getMessages, subscribeMessages } from './assets/js/supabase.js';
import { roll, initDiceBox } from './assets/js/dice.js';

// ── Constants ─────────────────────────────────────────────────
const STATS_ORDER = ['INT','REF','DEX','TECH','COOL','WILL','MOVE','BODY','EMP'];

const COND_COLORS = {
  'Seriously Wounded': '#FF8C00',
  'Mortally Wounded':  'var(--red)',
  'Stunned':           '#9B59B6',
  'Suppressed':        '#2980B9',
  'Prone':             '#7F8C8D',
  'Blinded':           '#C0392B',
  'Deafened':          '#7F8C8D',
  'On Fire':           '#E67E22',
  'Bleeding Out':      'var(--red)',
};

const SKILL_CAT = {
  'Concentration':'Awareness','Conceal/Reveal Object':'Awareness','Lip Reading':'Awareness',
  'Perception':'Awareness','Tracking':'Awareness',
  'Athletics':'Body','Contortionist':'Body','Dance':'Body',
  'Endurance':'Body','Resist Torture/Drugs':'Body','Stealth':'Body',
  'Drive Land Vehicle':'Control','Pilot Air Vehicle':'Control',
  'Pilot Sea Vehicle':'Control','Riding':'Control',
  'Accounting':'Education','Animal Handling':'Education','Bureaucracy':'Education',
  'Business':'Education','Composition':'Education','Criminology':'Education',
  'Cryptography':'Education','Deduction':'Education','Education':'Education',
  'Gamble':'Education','Language':'Education','Library Search':'Education',
  'Local Expert':'Education','Science':'Education','Streetwise':'Education',
  'Tactics':'Education','Wilderness Survival':'Education',
  'Brawling':'Fighting','Evasion':'Fighting','Martial Arts':'Fighting','Melee Weapon':'Fighting',
  'Acting':'Performance','Play Instrument':'Performance',
  'Archery':'Ranged Weapon','Autofire':'Ranged Weapon','Handgun':'Ranged Weapon',
  'Heavy Weapons':'Ranged Weapon','Shoulder Arms':'Ranged Weapon',
  'Bribery':'Social','Conversation':'Social','Human Perception':'Social',
  'Interrogation':'Social','Persuasion':'Social','Personal Grooming':'Social',
  'Trading':'Social','Wardrobe & Style':'Social',
  'Air Vehicle Tech':'Technique','Basic Tech':'Technique','Cybertech':'Technique',
  'Demolitions':'Technique','Electronics/Security Tech':'Technique','First Aid':'Technique',
  'Forgery':'Technique','Land Vehicle Tech':'Technique','Paint/Draw/Sculpt':'Technique',
  'Paramedic':'Technique','Photography/Film':'Technique','Pick Lock':'Technique',
  'Pick Pocket':'Technique','Sea Vehicle Tech':'Technique','Weaponstech':'Technique',
};
const CAT_ORDER = ['Awareness','Body','Control','Education','Fighting','Performance','Ranged Weapon','Social','Technique'];

const CYBER_LABELS = {
  neuralLink:'Neural Link', rightEye:'Cybereye (R)', leftEye:'Cybereye (L)',
  rightArm:'Cyberarm (R)', leftArm:'Cyberarm (L)',
  rightLeg:'Cyberleg (R)', leftLeg:'Cyberleg (L)',
  audio:'Audio Suite', internal:'Internal', external:'External',
  fashion:'Fashionware', borgware:'Borgware',
};

// ── State ─────────────────────────────────────────────────────
let char       = null;
let injuryData = null;  // { body: [...], head: [...] }
let allChars   = [];    // alle anderen Charaktere (für Injury-Zuweisung)
let critTarget = null;  // char-id oder 'npc'
let combatSession       = null;
let _allCharsFull       = [];
let deathSavePenalty    = 0;
let deathSaveStabilized = false;
let skillUpgradeMap     = {};   // skillName → { ip_cost_multiplier, ip_cost_by_next_level }
let buffTimerHandle     = null;
const notifiedBuffIds   = new Set();
let notesSaveTimer      = null;
let chatUnread          = 0;

function getInjuries() {
  try { return JSON.parse(char.critical_injuries || '[]'); } catch { return []; }
}

// ── Boot ──────────────────────────────────────────────────────
const id = new URLSearchParams(location.search).get('id');
if (!id) { location.replace('index.html'); }
if (id) {
  try {
    let rawItems;
    [char, injuryData, allChars, combatSession, rawItems] = await Promise.all([
      getCharacter(id),
      fetch('./assets/data/critical-injuries.json').then(r => r.json()).catch(() => null),
      getCharacters(),
      getActiveCombat(),
      fetch('./assets/data/items.json').then(r => r.json()).then(d => d.items || d).catch(() => []),
    ]);
    _allCharsFull = allChars;
    allChars = allChars.filter(c => c.id !== id);
    (rawItems || []).filter(i => i.category === 'Skill Upgrade').forEach(i => {
      skillUpgradeMap[i.name] = { ip_cost_multiplier: i.ip_cost_multiplier ?? 1, ip_cost_by_next_level: i.ip_cost_by_next_level || {} };
    });
    renderAll();
    show();
    requestNotifPermission();

    const chatHistory = await getMessages(50);
    renderChatMessages(chatHistory);
    setupChat();
    subscribeMessages(payload => {
      appendChatMessage(payload.new);
      if (!document.querySelector('[data-tab="chat"]')?.classList.contains('active')) {
        chatUnread++;
        const badge = document.getElementById('chatUnreadBadge');
        badge.textContent = chatUnread;
        badge.style.display = 'inline';
      }
    });

    subscribeCombat(payload => {
      const cs = payload.new;
      combatSession = cs?.is_active ? cs : null;
      renderCombatPanel();
    });

    subscribeCharacters(payload => {
      const updated = payload.new;
      if (!updated?.id) return;
      const fi = _allCharsFull.findIndex(c => c.id === updated.id);
      if (fi >= 0) Object.assign(_allCharsFull[fi], updated);
      if (updated.id !== char.id) {
        renderCombatPanel();
        return;
      }
      Object.assign(char, updated);
      renderConditionBadges();
      checkDeathSave();
      updateResDisplay();
      renderLuck();
      renderBuffs();
      if ((char.current_hp ?? 0) > 0) deathSavePenalty = 0;
      renderCombatPanel();
    });
  } catch(e) {
    document.getElementById('loader').innerHTML =
      `<span style="color:var(--red)">Fehler: ${e.message}</span>`;
  }
}

// Wire up shop link
if (id) document.getElementById('shopLink').href = `shop.html?id=${id}`;

// Try dice-box (optional, fires in background)
initDiceBox('#dice-canvas-placeholder');


// ── Show UI ───────────────────────────────────────────────────
function show() {
  document.getElementById('loader').style.display  = 'none';
  document.getElementById('topNav').style.display  = '';
  document.getElementById('charHeader').style.display = '';
  document.getElementById('tabBar').style.display  = '';
  document.getElementById('diceFab').style.display = '';
}

// ── Master render ─────────────────────────────────────────────
function renderAll() {
  renderHeader();
  renderStats();
  renderSkills();
  renderWeapons();
  renderArmor();
  renderCyberware();
  renderGear();
  renderLifepath();
  renderCritInjuries();
  setupTabs();
  setupResEditing();
  setupDice();
  setupTooltip();
  setupRemove();
  setupCritModal();
  setupSkillFavs();
  setupSkillUpgrades();
  setupNotes();
  renderConditionBadges();
  renderBuffs();
  checkDeathSave();
  renderCombatPanel();
}

// ── Header ────────────────────────────────────────────────────
function renderHeader() {
  document.title = `${char.name} — LZRV Hub`;
  document.getElementById('navName').textContent = char.name;
  document.getElementById('charName').textContent = char.name || '—';

  const sub = [char.role, char.handle && char.handle !== char.name ? char.handle : null,
               char.player_name ? `(${char.player_name})` : null]
    .filter(Boolean).join(' · ');
  document.getElementById('charSub').textContent = sub || '—';

  const ipBadgeEl = document.getElementById('charIpValue');
  if (ipBadgeEl) ipBadgeEl.textContent = char.improvement_points ?? 0;

  const img = document.getElementById('charPortrait');
  if (char.image_url) { img.src = char.image_url; img.alt = char.name; }
  else { img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76"><rect fill="%231a1a26" width="76" height="76"/><text y="50" x="50%" text-anchor="middle" font-size="36" fill="%23686880">👤</text></svg>'; }

  updateResDisplay();
  renderLuck();
}

function updateResDisplay() {
  const hp    = char.current_hp    || 0;
  const maxHp = char.max_hp        || 0;
  const hum   = char.current_humanity || 0;
  const maxHum= char.max_humanity  || 0;

  document.getElementById('hpCur').textContent  = hp;
  document.getElementById('hpMax').textContent  = maxHp;
  document.getElementById('humCur').textContent = hum;
  document.getElementById('humMax').textContent = maxHum;
  const hpFill = document.getElementById('hpFill');
  hpFill.style.width = maxHp ? (hp / maxHp * 100) + '%' : '0%';
  hpFill.classList.toggle('critical', hp > 0 && hp < 2);
  document.getElementById('humFill').style.width = maxHum ? (hum / maxHum * 100) + '%' : '0%';
}

function renderLuck() {
  const cur = char.current_luck || 0;
  const max = char.max_luck     || (char.stats?.LUCK) || 0;
  const box = document.getElementById('luckDots');
  box.innerHTML = '';
  for (let i = 1; i <= max; i++) {
    const d = document.createElement('span');
    d.className = 'luck-dot' + (i <= cur ? ' on' : '');
    d.dataset.idx = i;
    d.title = i <= cur ? 'Luck spent – klicken zum Wiederherstellen' : 'Luck verfügbar – klicken zum Ausgeben';
    box.appendChild(d);
  }
  document.getElementById('luckCount').textContent = `${cur}/${max}`;
}

// ── Stats tab ─────────────────────────────────────────────────
function renderStats() {
  const stats = char.stats || {};
  const luck  = char.max_luck || 0;

  const grid = document.getElementById('tab-stats');
  let html = '<div class="stat-grid">';
  for (const s of STATS_ORDER) {
    html += `<div class="stat-card"><div class="stat-key">${s}</div><div class="stat-val">${stats[s] ?? 0}</div></div>`;
  }
  html += `<div class="stat-card"><div class="stat-key">LUCK</div><div class="stat-val">${luck}</div></div>`;
  html += '</div>';

  html += '<h3 class="sec-head">Ressourcen</h3><div class="res-grid">';
  const injPenalty = getInjuries().filter(i => i.effect?.includes('Base Death Save Penalty is increased')).length;
  const dsBase     = char.death_save ?? 0;
  const dsDisplay  = injPenalty ? `${dsBase + injPenalty} <small style="color:var(--red)">(+${injPenalty})</small>` : dsBase;
  const res = [
    ['Cash',   char.cash               ?? 0, 'eb'],
    ['IP',     char.improvement_points ?? 0, ''],
    ['Rep',    char.reputation         ?? 0, ''],
    ['Death Save', dsDisplay, ''],
    ['SW Threshold', char.seriously_wounded_threshold ?? 0, ''],
    ['HP',     `${char.current_hp ?? 0} / ${char.max_hp ?? 0}`, ''],
  ];
  for (const [k, v, unit] of res) {
    html += `<div class="res-card"><span class="res-card-label">${k}</span><span class="res-card-val">${v}${unit ? ' '+unit : ''}</span></div>`;
  }
  html += '</div>';
  grid.innerHTML = html;
}

// ── Skills tab ────────────────────────────────────────────────
function renderSkills() {
  const skills = char.skills || {};
  const stats  = char.stats  || {};
  const el     = document.getElementById('tab-skills');

  if (!Object.keys(skills).length) {
    el.innerHTML = '<p class="empty-state">Keine Skills gespeichert. PDF-Feldnamen eventuell abweichend.</p>'; return;
  }

  const FAVS_KEY = `lzrv_skill_favs_${char.id}`;
  const favs = new Set(JSON.parse(localStorage.getItem(FAVS_KEY) || '[]'));

  const groups = {};
  for (const [name, data] of Object.entries(skills)) {
    const cat = SKILL_CAT[name] || `Stat: ${data.stat}`;
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push({ name, ...data });
  }

  function skillRowHtml(sk) {
    const statVal  = stats[sk.stat] ?? 0;
    const base     = statVal + (sk.lvl || 0);
    const expr     = `1d10+${base}`;
    const upData   = skillUpgradeMap[sk.name] || {};
    const nextLvl  = (sk.lvl ?? 0) + 1;
    const cost     = upData.ip_cost_by_next_level?.[String(nextLvl)]
                   ?? (20 * (upData.ip_cost_multiplier ?? 1) * (sk.lvl ?? 1));
    const ip       = char.improvement_points ?? 0;
    const canAfford = ip >= cost && nextLvl <= 10;
    const upgradeBtn = nextLvl <= 10
      ? `<button class="skill-up-btn${canAfford ? '' : ' unaffordable'}"
                 data-skill="${sk.name}" data-cost="${cost}" data-nextlvl="${nextLvl}"
                 title="${canAfford ? `${cost} IP → Lvl ${nextLvl}` : `${cost - ip} IP fehlen`}">▲</button>`
      : `<span class="skill-maxed" title="Max">—</span>`;
    return `<div class="skill-row">
      <button class="skill-fav-btn${favs.has(sk.name) ? ' active' : ''}" data-fav="${sk.name}">★</button>
      <span class="skill-name">${sk.name}</span>
      <span class="skill-stat">${sk.stat}</span>
      <span class="skill-lvl">${sk.lvl ?? 0}</span>
      <span class="skill-base">${base}</span>
      <button class="roll-btn" data-expr="${expr}" data-ctx="${sk.name} skill check" data-skill="1" title="1d10+${base}">⚄</button>
      ${upgradeBtn}
    </div>`;
  }

  let html = `<div class="skill-ip-banner">Verfügbare IP: <strong id="skillIpDisplay">${char.improvement_points ?? 0}</strong></div>`;

  // Favorites section
  const favSkills = [...favs].map(name => {
    const data = skills[name];
    return data ? { name, ...data } : null;
  }).filter(Boolean);
  if (favSkills.length) {
    html += '<div class="skill-favs-section"><div class="skill-favs-label">★ Favoriten</div>';
    for (const sk of favSkills) html += skillRowHtml(sk);
    html += '</div>';
  }

  html += '<div class="skill-row" style="font-size:.62rem;color:var(--text-muted);border-bottom:1px solid var(--border);padding-bottom:.3rem;margin-bottom:.4rem">'
    + '<span></span><span>Skill</span><span style="text-align:center">Stat</span><span style="text-align:center">LVL</span><span style="text-align:center">Base</span><span></span><span style="text-align:center">UP</span></div>';

  const orderedCats = [...CAT_ORDER.filter(c => groups[c]), ...Object.keys(groups).filter(c => !CAT_ORDER.includes(c))];
  for (const cat of orderedCats) {
    html += `<div class="skill-group"><div class="skill-cat-label">${cat}</div>`;
    for (const sk of groups[cat].sort((a,b) => a.name.localeCompare(b.name))) html += skillRowHtml(sk);
    html += '</div>';
  }

  el.innerHTML = html;
}

// ── Weapons tab ───────────────────────────────────────────────
function renderWeapons() {
  const weapons = char.weapons || [];
  const el = document.getElementById('tab-weapons');

  if (!weapons.length) { el.innerHTML = '<p class="empty-state">Keine Waffen eingetragen.</p>'; return; }

  el.innerHTML = weapons.map((w, i) => `
    <div class="weapon-card has-tooltip" data-tooltip='${safeJson(w)}'>
      <div class="weapon-name">
        ${w.name}
        <button class="remove-btn" data-inv="weapons" data-idx="${i}">✕</button>
      </div>
      <div class="weapon-stats">
        <div class="ws-pair"><span class="ws-label">Damage</span>
          <span class="ws-val">${w.damage
            ? `<button class="roll-btn dmg-btn" data-expr="${w.damage}" data-ctx="${w.name} damage">${w.damage}</button>`
            : '—'}</span>
        </div>
        <div class="ws-pair"><span class="ws-label">ROF</span><span class="ws-val">${w.rof || '—'}</span></div>

// ── Live resource editing ─────────────────────────────────────
function setupResEditing() {
  // +/- buttons
  document.querySelectorAll('.res-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const res   = btn.dataset.res;
      const delta = parseInt(btn.dataset.d, 10);
      await changeRes(res, delta);
    });
  });

  // Contenteditable current values
  document.querySelectorAll('.res-cur').forEach(el => {
    el.addEventListener('blur', async () => {
      const res = el.dataset.res;
      const val = parseInt(el.textContent, 10);
      if (isNaN(val)) { el.textContent = char[`current_${res}` ] || 0; return; }
      await setRes(res, val);
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  });

  // Luck dots
  document.getElementById('luckDots').addEventListener('click', async e => {
    const dot = e.target.closest('.luck-dot');
    if (!dot) return;
    const idx = parseInt(dot.dataset.idx, 10);
    const cur = char.current_luck || 0;
    // Click on a filled dot → reduce luck, click on empty → restore to that level
    const newVal = dot.classList.contains('on') ? idx - 1 : idx;
    await setRes('luck', newVal);
  });
}

async function changeRes(res, delta) {
  const field   = `current_${res}`;
  const maxField = res === 'hp' ? 'max_hp' : res === 'humanity' ? 'max_humanity' : 'max_luck';
  const current = char[field] ?? 0;
  const max     = char[maxField] ?? 999;
  const newVal  = Math.max(0, Math.min(max, current + delta));
  await setRes(res, newVal);
}

async function setRes(res, value) {
  const field = `current_${res}`;
  char[field]  = value;
  updateResDisplay();
  renderLuck();
  try {
    await patchCharacter(char.id, { [field]: value });
  } catch(e) {
    console.error('[player] patch failed:', e);
  }
}

// ── Dice system ───────────────────────────────────────────────
const diceLog = [];

function setupDice() {
  const fab     = document.getElementById('diceFab');
  const popup   = document.getElementById('dicePopup');
  const closeBtn= document.getElementById('diceClose');
  const exprIn  = document.getElementById('diceExpr');
  const rollBtn = document.getElementById('diceRollBtn');

  fab.addEventListener('click', () => popup.classList.toggle('open'));
  closeBtn.addEventListener('click', () => popup.classList.remove('open'));

  // Quick die buttons
  document.querySelectorAll('.die-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const isSkill = btn.classList.contains('skill-check');
      doRoll(btn.dataset.expr, { isSkillCheck: isSkill, context: btn.dataset.expr });
    });
  });

  // Custom roll
  rollBtn.addEventListener('click', () => doRoll(exprIn.value.trim() || '1d10'));
  exprIn.addEventListener('keydown', e => { if (e.key === 'Enter') doRoll(exprIn.value.trim() || '1d10'); });

  // Inline roll buttons (weapons DMG + skill roll buttons) — delegated
  document.body.addEventListener('click', e => {
    const btn = e.target.closest('.roll-btn, .dmg-btn');
    if (!btn) return;
    const expr    = btn.dataset.expr;
    const ctx     = btn.dataset.ctx || expr;
    const isSkill = btn.dataset.skill === '1';
    const isDmg   = btn.classList.contains('dmg-btn');
    if (!expr) return;
    if (isSkill) {
      showSkillCheckModal(expr, ctx);
    } else {
      doRoll(expr, { context: ctx, isSkillCheck: false, isDamageRoll: isDmg });
    }
  });
}

async function doRoll(expression, opts = {}) {
  if (!expression) return;
  document.getElementById('dicePopup').classList.add('open');
  document.getElementById('diceFab').classList.add('rolling');

  const result = await roll(expression, {
    ...opts,
    characterId:   char?.id   || null,
    characterName: char?.name || null,
  });

  document.getElementById('diceFab').classList.remove('rolling');

  // Update popup result
  const numEl    = document.getElementById('diceResultNum');
  const detailEl = document.getElementById('diceResultDetail');
  numEl.className = 'dice-result-num pop'
    + (result.isCritSuccess ? ' crit-s' : '')
    + (result.isCritFailure ? ' crit-f' : '');
  numEl.textContent = result.total;

  const breakdown = result.individualRolls
    .map(r => {
      if (r.isCritBonus)   return `+${r.value}(crit!)`;
      if (r.isCritPenalty) return `${r.value}(botch!)`;
      return `[${r.value}]`;
    }).join(' ');
  const label = opts.context ? `${opts.context}: ` : '';
  detailEl.textContent = label + breakdown;

  // Remove pop class after animation so it can re-trigger
  numEl.addEventListener('animationend', () => numEl.classList.remove('pop'), { once: true });

  // Add to log
  diceLog.unshift({ expression, result, context: opts.context });
  if (diceLog.length > 10) diceLog.pop();
  renderDiceLog();

  // Toast
  showToast(result);

  // Critical Injury trigger — damage rolls only
  if (opts.isDamageRoll && injuryData) {
    const sixCount = result.individualRolls.filter(r => r.die === 6 && Math.abs(r.value) === 6).length;
    if (sixCount >= 2) showCritInjuryFlow();
  }
}

// ── safeJson — tooltip data from stored item snapshot ────────
function safeJson(obj) {
  return JSON.stringify({
    notes:         obj.notes         || null,
    damage:        obj.damage        || null,
    humanity_loss: obj.humanity_loss || null,
    install:       obj.install       || null,
    raw_cost:      obj.raw_cost      || null,
  }).replace(/'/g, '&#39;');
}

// ── Item tooltip ──────────────────────────────────────────────
function setupTooltip() {
  const tip = document.getElementById('item-tooltip');
  let hideTimer = null;

  function show(el, data) {
    clearTimeout(hideTimer);
    const notes    = data.notes    ? `<div class="itp-notes">${data.notes.length > 130 ? data.notes.slice(0,127)+'…' : data.notes}</div>` : '';
    const dmgRow   = data.damage   ? `<div class="itp-row"><span class="itp-key">Damage</span><span class="itp-val">${data.damage}</span></div>` : '';
    const hlRow    = data.humanity_loss ? `<div class="itp-row"><span class="itp-key">Humanity</span><span class="itp-val">${data.humanity_loss}</span></div>` : '';
    const instRow  = data.install  ? `<div class="itp-row"><span class="itp-key">Install</span><span class="itp-val">${data.install}</span></div>` : '';
    const priceRow = data.raw_cost ? `<div class="itp-row"><span class="itp-key">Price</span><span class="itp-val">${data.raw_cost}</span></div>` : '';
    tip.innerHTML  = `<div class="itp-meta">${dmgRow}${hlRow}${instRow}${priceRow}</div>${notes}`;

    tip.hidden = false;
    const r  = el.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let top  = r.top - th - 8;
    let left = r.left + r.width / 2 - tw / 2;
    if (top < 8) top = r.bottom + 8;
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    tip.style.top  = top  + 'px';
    tip.style.left = left + 'px';
  }

  function scheduleHide() { hideTimer = setTimeout(() => { tip.hidden = true; }, 120); }

  document.addEventListener('mouseover', e => {
    const trigger = e.target.closest('.has-tooltip');
    if (!trigger) return;
    try { show(trigger, JSON.parse(trigger.dataset.tooltip)); } catch {}
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('.has-tooltip')) scheduleHide();
  });
}

async function removeItem(inv, idx) {

    char.armor = { ...(char.armor || {}), [idx]: { name: '', sp: 0, penalty: 0 } };

    await patchCharacter(char.id, { armor: char.armor });

    if (inv === 'cyberware') renderCyberware();

      <select id="critTargetSelect" style="width:100%;padding:.4rem .6rem;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.82rem">
        ${targetOptions}
      </select>
    </div>
    <div class="crit-modal-sub">War das ein Aimed Shot to the Head?</div>

  document.getElementById('critBody').onclick   = () => rollInjury('body');
  document.getElementById('critCancel').onclick = () => { document.getElementById('crit-modal').hidden = true; };
}

function rollInjury(table) {
  const d1 = Math.floor(Math.random() * 6) + 1;
  const d2 = Math.floor(Math.random() * 6) + 1;
  const rollVal = d1 + d2;
  const injury  = injuryData[table].find(i => i.roll === rollVal) || injuryData[table][0];
  const already = getInjuries().some(i => i.name === injury.name);
  showInjuryResult(injury, rollVal, table, already);
}

function showInjuryResult(injury, rollVal, table, already) {
  const box = document.getElementById('critModalBox');
  box.innerHTML = `
    <div class="crit-modal-title">CRITICAL INJURY</div>
    <div class="crit-injury-name">${injury.name}</div>
    <div class="crit-roll-info">2d6 = ${rollVal} · ${table === 'head' ? 'HEAD' : 'BODY'} Table</div>
    <hr class="crit-divider">
    <div class="crit-field-row">
      <div class="crit-field-key">Effect</div>
      <div class="crit-field-val">${injury.effect}</div>
    </div>
    <div class="crit-field-row">
      <div class="crit-field-key">Quick Fix</div>
      <div class="crit-field-val">${injury.quick_fix || '—'}</div>
    </div>
    <div class="crit-field-row">
      <div class="crit-field-key">Treatment</div>
      <div class="crit-field-val">${injury.treatment}</div>
    </div>
    <hr class="crit-divider">
    <div class="crit-bonus-dmg">⚠ +5 Bonus Damage direkt auf HP (ignoriert Armor)</div>
    ${already ? `<div class="crit-already">⚡ Charakter hat diese Injury bereits — Re-roll empfohlen!</div>` : ''}
    <div class="crit-modal-btns">
      <button class="btn btn-primary" id="critApply">Apply to Character</button>
      <button class="btn btn-ghost" id="critReroll">Re-roll</button>
      <button class="btn btn-ghost" id="critBack">← Zurück</button>
      <button class="btn btn-ghost" id="critIgnore">Ignorieren</button>
    </div>`;
  document.getElementById('critApply').onclick  = () => applyInjury(injury, table);
  document.getElementById('critReroll').onclick = () => rollInjury(table);
  document.getElementById('critBack').onclick   = () => showCritInjuryFlow();
  document.getElementById('critIgnore').onclick = () => { document.getElementById('crit-modal').hidden = true; };
}

async function applyInjury(injury, table) {
  if (!critTarget) {
    const box  = document.getElementById('critModalBox');
    let warn   = box.querySelector('.crit-no-target');
    if (!warn) {
      warn = document.createElement('div');
      warn.className = 'crit-no-target';
      warn.style.cssText = 'color:var(--red);font-size:.75rem;margin-top:.4rem';
      box.appendChild(warn);
    }
    warn.textContent = 'Bitte erst ein Ziel auswählen.';
    return;
  }

  if (critTarget === 'npc') {
    logRoll({ characterId: char.id, characterName: char.name,
      expression: '2d6', individualRolls: [], modifier: 0, total: 0,
      context: `Critical Injury (NPC): ${injury.name}`,
      isCritSuccess: false, isCritFailure: false }).catch(() => {});
    document.getElementById('crit-modal').hidden = true;
    return;
  }

  try {
    const target   = await getCharacter(critTarget);
    const injuries = JSON.parse(target.critical_injuries || '[]');
    injuries.push({ ...injury, table });
    const newHp = Math.max(0, (target.current_hp ?? 0) - 5);
    const patch = { critical_injuries: JSON.stringify(injuries), current_hp: newHp };
    if (newHp === 0) patch.mortally_wounded = true;
    await patchCharacter(critTarget, patch);
    logRoll({ characterId: char.id, characterName: char.name,
      expression: '2d6', individualRolls: [], modifier: 0, total: 0,
      context: `Critical Injury → ${target.name}: ${injury.name}`,
      isCritSuccess: false, isCritFailure: false }).catch(() => {});
  } catch (e) {
    console.warn('applyInjury failed:', e);
  }
  document.getElementById('crit-modal').hidden = true;
}

// ── Combat Panel ──────────────────────────────────────────────
function renderCombatPanel() {
  const panel = document.getElementById('combatPanel');
  if (!combatSession?.is_active) {
    panel.style.display = 'none';
    document.body.classList.remove('my-turn', 'combat-active');
    return;
  }
  document.body.classList.add('combat-active');
  panel.style.display = 'block';
  document.getElementById('initRound').textContent = combatSession.round ?? 1;
  const combatants = combatSession.combatants || [];
  const idx = combatSession.current_turn_index ?? 0;
  document.getElementById('combatCombatants').innerHTML = combatants.map((c, i) => {
    const isActive = i === idx;
    const isMe     = !c.isNpc && c.id === char.id;
    if (c.isNpc) {
      if (!c.isVisibleToPlayers) return '';
      return `<div class="combat-card combat-card--npc${isActive ? ' combat-card--active' : ''}">
        <div class="combat-card-portrait">
          ${c.imageUrl ? `<img src="${c.imageUrl}" alt="${escapeHtml(c.name)}">` : '<div class="combat-portrait-placeholder">👤</div>'}
        </div>
        <div class="combat-card-info">
          <div class="combat-card-name">${escapeHtml(c.name)}</div>
          <div class="npc-label">FEIND</div>
        </div>
        ${isActive ? '<div class="combat-turn-indicator">▶</div>' : ''}
      </div>`;
    }
    const liveChar = _allCharsFull.find(ch => ch.id === c.id);
    const hpCur = liveChar?.current_hp ?? c.hp;
    const hpMax = liveChar?.max_hp ?? c.maxHp;
    const hpPct = hpMax > 0 ? Math.round((hpCur / hpMax) * 100) : 0;
    const hpCol = hpPct > 50 ? '#2ecc71' : hpPct > 25 ? '#f39c12' : '#e74c3c';
    const conds = liveChar?.conditions || [];
    return `<div class="combat-card combat-card--player${isActive ? ' combat-card--active' : ''}${isMe ? ' combat-card--mine' : ''}">
      <div class="combat-card-portrait">
        ${c.imageUrl ? `<img src="${c.imageUrl}" alt="${escapeHtml(c.name)}">` : '<div class="combat-portrait-placeholder">⚡</div>'}
      </div>
      <div class="combat-card-info">
        <div class="combat-card-name">${escapeHtml(c.name)}</div>
        <div class="combat-hp-bar-wrap">
          <div class="combat-hp-bar" style="width:${hpPct}%;background:${hpCol}"></div>
        </div>
        <div class="combat-hp-text">${hpCur} / ${hpMax}</div>
        ${conds.length ? `<div class="combat-conditions">${conds.map(cd => `<span class="cond-badge">${escapeHtml(cd)}</span>`).join('')}</div>` : ''}
      </div>
      ${isActive ? '<div class="combat-turn-indicator">▶</div>' : ''}
    </div>`;
  }).join('');
  checkMyTurn();
}

function checkMyTurn() {
  if (!combatSession?.is_active) { document.body.classList.remove('my-turn'); return; }
  const combatants = combatSession.combatants || [];
  const current = combatants[combatSession.current_turn_index];
  const isMyTurn = current?.id === char.id;
  const was = document.body.classList.contains('my-turn');
  document.body.classList.toggle('my-turn', isMyTurn);
  if (isMyTurn && !was) playPingSound();
}

function playPingSound() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  } catch {}
}

// ── Condition Badges ──────────────────────────────────────────
function renderConditionBadges() {
  const wrap = document.getElementById('conditionBadges');
  if (!wrap) return;
  const conds = char.conditions || [];
  wrap.innerHTML = conds.map(c => {
    const color  = COND_COLORS[c] || 'var(--text-muted)';
    const isMort = c === 'Mortally Wounded';
    return `<span class="cond-badge${isMort ? ' cond-mortally' : ''}" style="border-color:${color};color:${color}">${c}</span>`;
  }).join('');
}

// ── Death Save ────────────────────────────────────────────────
function checkDeathSave() {
  const isMortCond = (char.conditions || []).includes('Mortally Wounded');
  const show = (char.current_hp ?? 0) <= 0 || isMortCond;
  const btn = document.getElementById('deathSaveBtn');
  btn.style.display = show ? 'block' : 'none';
  // Reset stabilized state if healed
  if (!show && deathSaveStabilized) {
    deathSaveStabilized = false;
    deathSavePenalty = 0;
  }
  if (!show) {
    btn.textContent = '☠ DEATH SAVE';
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.style.animation = '';
  }
  document.body.classList.toggle('near-death', show && !deathSaveStabilized);
}

document.getElementById('deathSaveBtn').addEventListener('click', async () => {
  // If stabilized, clicking again means next-round re-roll
  if (deathSaveStabilized) {
    deathSaveStabilized = false;
    checkDeathSave();
    return;
  }

  const body   = char.stats?.BODY ?? 0;
  const target = Math.max(1, (char.death_save ?? body) - deathSavePenalty);
  const d10    = Math.floor(Math.random() * 10) + 1;
  deathSavePenalty++;

  const success = d10 !== 10 && d10 <= target;
  const context = `Death Save (Ziel ≤${target}, Penalty ${deathSavePenalty - 1})`;

  logRoll({
    characterId: char.id, characterName: char.name,
    expression: '1d10', individualRolls: [{ die: 10, value: d10 }],
    modifier: 0, total: d10, context,
    isCritSuccess: false, isCritFailure: d10 === 10,
  }).catch(() => {});

  showDeathSaveResult(d10, target, success);

  if (success) {
    deathSaveStabilized = true;
    // HP auf 1 + Mortally Wounded entfernen damit Reload korrekt ist
    const conds = (char.conditions || []).filter(c => c !== 'Mortally Wounded');
    char.current_hp = 1;
    char.conditions = conds;
    await patchCharacter(char.id, { current_hp: 1, conditions: conds }).catch(() => {});
    updateResDisplay();
    renderConditionBadges();
    document.body.classList.remove('near-death');
    const btn = document.getElementById('deathSaveBtn');
    btn.style.display = 'none';
  } else {
    const conds = [...(char.conditions || [])];
    if (!conds.includes('Mortally Wounded')) conds.push('Mortally Wounded');
    await patchCharacter(char.id, { conditions: conds }).catch(() => {});
  }
});

function showDeathSaveResult(d10, target, success) {
  const el = document.createElement('div');
  el.className = `death-save-result ${success ? 'ds-success' : 'ds-fail'}`;
  el.innerHTML = `
    <div class="ds-num">${d10}</div>
    <div class="ds-label">${success ? `✓ Überlebt (≤ ${target})` : d10 === 10 ? '✗ AUTO-FAIL' : `✗ Gestorben (> ${target})`}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ── Skill Check Modal ─────────────────────────────────────────
function showSkillCheckModal(expr, ctx) {
  const skillName = ctx.replace(' skill check', '');
  const skData    = char.skills?.[skillName];
  const statVal   = skData ? (char.stats?.[skData.stat] ?? 0) : 0;
  const lvl       = skData?.lvl ?? 0;
  const base      = statVal + lvl;
  const statStr   = skData?.stat ?? '?';

  const overlay = document.createElement('div');
  overlay.className = 'skill-modal-overlay';
  overlay.innerHTML = `
    <div class="skill-modal-box">
      <div class="skill-modal-title">${skillName} CHECK</div>
      <div class="skill-modal-formula">1d10 + ${statStr} (${statVal}) + Lvl ${lvl} = <strong>1d10 + ${base}</strong></div>
      <div class="skill-modal-dv">
        <label>DV (optional):</label>
        <input type="number" id="skillDvInput" class="ctrl-input" placeholder="—" min="0" style="width:70px;margin-left:.5rem">
      </div>
      <div class="skill-modal-result" id="skillResult" style="display:none"></div>
      <div class="skill-modal-btns">
        <button class="btn btn-primary" id="skillRollBtn">Würfeln</button>
        <button class="btn btn-ghost" id="skillCloseBtn">Schließen</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('skillCloseBtn').onclick = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  document.getElementById('skillRollBtn').onclick = async () => {
    const dv     = parseInt(document.getElementById('skillDvInput').value) || null;
    const ctxStr = dv !== null ? `${skillName} Check vs DV ${dv}` : `${skillName} Check`;

    const result = await roll(expr, {
      context: ctxStr,
      isSkillCheck: true,
      characterId:   char.id,
      characterName: char.name,
    });

    const success  = dv !== null ? result.total >= dv : null;
    const label    = result.isCritSuccess ? '★ CRIT! ' : result.isCritFailure ? '✗ BOTCH! ' : '';
    const succHtml = dv !== null
      ? `<div class="skill-result-verdict${success ? ' verdict-ok' : ' verdict-fail'}">
           ${success ? `✅ Erfolg (DV ${dv} erreicht)` : `❌ Fehlschlag (DV ${dv})`}
         </div>`
      : '';

    const resultEl = document.getElementById('skillResult');
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
      <div class="skill-result-num${result.isCritSuccess ? ' crit-s' : result.isCritFailure ? ' crit-f' : ''}">${label}${result.total}</div>
      ${succHtml}`;

    // Mirror to main popup log
    const numEl    = document.getElementById('diceResultNum');
    const detailEl = document.getElementById('diceResultDetail');
    numEl.className  = 'dice-result-num pop' + (result.isCritSuccess ? ' crit-s' : result.isCritFailure ? ' crit-f' : '');
    numEl.textContent = result.total;
    detailEl.textContent = ctxStr;
    diceLog.unshift({ expression: expr, result, context: ctxStr });
    if (diceLog.length > 10) diceLog.pop();
    renderDiceLog();
  };
}

// ── Skill Favorites (body delegation, set up once) ────────────
function setupSkillFavs() {
  document.body.addEventListener('click', e => {
    const btn = e.target.closest('.skill-fav-btn');
    if (!btn) return;
    const FAVS_KEY = `lzrv_skill_favs_${char.id}`;
    const favs = new Set(JSON.parse(localStorage.getItem(FAVS_KEY) || '[]'));
    const sk = btn.dataset.fav;
    if (favs.has(sk)) favs.delete(sk); else favs.add(sk);
    localStorage.setItem(FAVS_KEY, JSON.stringify([...favs]));
    renderSkills();
  });
}

// ── Skill IP Upgrade ──────────────────────────────────────────
function setupSkillUpgrades() {
  document.body.addEventListener('click', async e => {
    const btn = e.target.closest('.skill-up-btn');
    if (!btn || btn.classList.contains('unaffordable')) return;
    const skillName = btn.dataset.skill;
    const cost      = parseInt(btn.dataset.cost);
    const nextLvl   = parseInt(btn.dataset.nextlvl);
    const newIp     = (char.improvement_points ?? 0) - cost;
    const newSkills = JSON.parse(JSON.stringify(char.skills || {}));
    if (newSkills[skillName]) newSkills[skillName] = { ...newSkills[skillName], lvl: nextLvl };
    try {
      await patchCharacter(char.id, { improvement_points: newIp, skills: newSkills });
      char.improvement_points = newIp;
      char.skills = newSkills;
      renderSkills();
      const banner = document.getElementById('skillIpDisplay');
      if (banner) banner.textContent = newIp;
      const ipBadgeEl = document.getElementById('charIpValue');
      if (ipBadgeEl) ipBadgeEl.textContent = newIp;
      renderStats();
    } catch (err) {
      console.error('[player] skill upgrade failed:', err);
    }
  });
}

// ── Session Notes ─────────────────────────────────────────────
function setupNotes() {
  const area = document.getElementById('playerNotesArea');
  if (!area) return;
  area.value = char.session_notes || '';
  area.addEventListener('input', () => {
    const statusEl = document.getElementById('notesSaveStatus');
    clearTimeout(notesSaveTimer);
    if (statusEl) statusEl.textContent = '…';
    notesSaveTimer = setTimeout(async () => {
      await patchCharacter(char.id, { session_notes: area.value }).catch(() => {});
      if (statusEl) {
        statusEl.textContent = '✓ Gespeichert';
        setTimeout(() => { statusEl.textContent = ''; }, 2000);
      }
    }, 2000);
  });
}

// ── Buff Timer ────────────────────────────────────────────────
function formatRemaining(ms) {
  const s = Math.ceil(ms / 1000);
  if (s >= 3600) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  if (s >= 60)   return `${Math.floor(s / 60)}m ${s % 60}s`;
  return `${s}s`;
}

function renderBuffs() {
  const buffs = char.buffs || [];
  const bar   = document.getElementById('buffBar');
  if (!bar) return;
  if (!buffs.length) {
    bar.style.display = 'none';
    clearInterval(buffTimerHandle); buffTimerHandle = null;
    return;
  }
  bar.style.display = 'flex';
  const list = document.getElementById('buffList');
  const now  = Date.now();

  list.innerHTML = buffs.map(b => {
    const remaining = b.expires_at ? new Date(b.expires_at).getTime() - now : null;
    const expired   = remaining !== null && remaining <= 0;

    if (expired && !notifiedBuffIds.has(b.id)) {
      notifiedBuffIds.add(b.id);
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`⚠ ${b.name} abgelaufen`, { body: char.name });
      }
      setTimeout(async () => {
        char.buffs = (char.buffs || []).filter(x => x.id !== b.id);
        await patchCharacter(char.id, { buffs: char.buffs }).catch(() => {});
        renderBuffs();
      }, 0);
    }

    const timeStr = remaining === null ? '∞' : expired ? 'ABGELAUFEN' : formatRemaining(remaining);
    return `<div class="buff-chip${expired ? ' expired' : ''}" title="${b.effect || ''}">
      <span class="buff-name">${b.name}</span>
      <span class="buff-time">${timeStr} ⏱</span>
    </div>`;
  }).join('');

  if (!buffTimerHandle) {
    buffTimerHandle = setInterval(renderBuffs, 1000);
  }
}

async function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

// ── Chat ──────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'chat-lightbox';
  lb.innerHTML = `<img src="${src}" alt="">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}

function appendChatMessage(m) {
  const isDm = m.sender_role === 'dm';
  const el   = document.createElement('div');
  el.className = `chat-msg ${isDm ? 'chat-msg--dm' : 'chat-msg--player'}`;
  const time = new Date(m.created_at).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
  el.innerHTML =
    `<div class="chat-msg-header">` +
      `<span class="chat-sender${isDm ? ' chat-sender--dm' : ''}">${isDm ? 'DM' : escapeHtml(m.sender)}</span>` +
      `<span class="chat-time">${time}</span>` +
    `</div>` +
    (m.content   ? `<div class="chat-text">${escapeHtml(m.content)}</div>` : '') +
    (m.image_url ? `<img class="chat-img" src="${m.image_url}" alt="Bild" data-src="${m.image_url}">` : '');
  const container = document.getElementById('chatMessages');
  container.appendChild(el);
  if (m.image_url) {
    el.querySelector('.chat-img').addEventListener('click', e => openLightbox(e.currentTarget.dataset.src));
  }
  container.scrollTop = container.scrollHeight;
}

function renderChatMessages(msgs) {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';
  msgs.forEach(m => appendChatMessage(m));
}

function setupChat() {
  const sendBtn = document.getElementById('chatSendBtn');
  const input   = document.getElementById('chatInput');
  const panel   = document.getElementById('chatPanel');
  const toggle  = document.getElementById('chatToggle');
  const close   = document.getElementById('chatPanelClose');

  toggle.addEventListener('click', () => {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      chatUnread = 0;
      const badge = document.getElementById('chatUnreadBadge');
      badge.style.display = 'none';
      document.getElementById('chatMessages').scrollTop = 999999;
    }
  });
  close.addEventListener('click', () => panel.classList.remove('open'));

  sendBtn.addEventListener('click', async () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await sendMessage({ sender: char.handle || char.name, sender_role: 'player', content: text });
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
  });
}

let _toastTimer = null;
function showToast(result) {
  const toast = document.getElementById('rollToast');
  clearTimeout(_toastTimer);
  toast.className = 'roll-toast show'
    + (result.isCritSuccess ? ' crit-s' : '')
    + (result.isCritFailure ? ' crit-f' : '');
  const label = result.isCritSuccess ? '★ CRIT! ' : result.isCritFailure ? '✗ BOTCH! ' : '';
  toast.textContent = `${label}${result.total}`;
  _toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}
