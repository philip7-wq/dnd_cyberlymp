<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — LZRV Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>

<nav class="nav">
  <img src="assets/img/logo.png" alt="LZRV Hub" class="nav-logo-img">
  <span id="navCharName" style="font-family:var(--font-display);font-size:.85rem;color:var(--red);margin-left:.75rem"></span>
  <span class="nav-cash" id="navCash"></span>
  <span id="psychosisStatus"></span>
  <a id="backLink" href="index.html" class="btn btn-ghost" style="font-size:.75rem;margin-left:1rem">← Charakter</a>
</nav>

<div class="shop-layout">

  <!-- Sidebar -->
  <aside class="shop-sidebar">
    <div class="sidebar-label">Kategorie</div>
    <!-- Buttons are injected by JS -->
    <div id="catButtons"></div>
  </aside>

  <!-- Main: grid + detail -->
  <div class="shop-main" id="shopMain">
    <div class="shop-grid-wrap" id="shopGridWrap">
      <div class="shop-loader" id="shopLoader">LADE ITEMS…</div>
    </div>
    <aside class="shop-detail" id="shopDetail"></aside>
  </div>

</div>

<!-- Slot Picker Modal -->
<div id="slotModal" hidden style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);align-items:center;justify-content:center">
  <div style="background:#111;border:1px solid #00E5FF;border-radius:6px;padding:1.5rem;max-width:320px;width:90%">
    <div id="slotModalTitle" style="font-family:Audiowide,sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#00E5FF;margin-bottom:1rem"></div>
    <div id="slotModalBtns" style="display:flex;flex-wrap:wrap;gap:.5rem"></div>
    <button id="slotModalCancel" style="margin-top:1rem;background:none;border:1px solid #444;color:#aaa;border-radius:4px;padding:.35rem .8rem;cursor:pointer;font-size:.78rem;width:100%">Abbrechen</button>
  </div>
</div>

<!-- Cyberpsychosis Modal -->
<div id="psychosisModal" hidden style="position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);align-items:center;justify-content:center">
  <div style="background:#0d0000;border:2px solid #FF0000;border-radius:6px;padding:2rem;max-width:380px;width:92%;text-align:center">
    <div class="psychosis-title">⚠ CYBERPSYCHOSIS ⚠</div>
    <div style="color:#FF2D2D;font-size:.95rem;margin-bottom:1rem;line-height:1.6">Humanity auf <strong>0</strong> gesunken.<br>Der GM übernimmt die Kontrolle über diesen Charakter.</div>
    <div style="color:#aaa;font-size:.78rem;margin-bottom:1.25rem">Cyberpunk RED Core Rulebook S. 229</div>
    <button id="psychosisModalClose" style="background:#FF0000;border:none;color:#fff;border-radius:4px;padding:.5rem 2rem;cursor:pointer;font-family:Audiowide,sans-serif;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase">Verstanden</button>
  </div>
</div>

<!-- Kauf-Bestätigung Modal -->
<div id="buyConfirmModal" hidden style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);align-items:center;justify-content:center">
  <div style="background:#111;border:1px solid #444;border-radius:6px;padding:1.5rem;max-width:300px;width:90%">
    <div style="font-family:Audiowide,sans-serif;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#aaa;margin-bottom:.6rem">Kauf bestätigen</div>
    <div id="buyConfirmText" style="font-size:.92rem;color:#eee;margin-bottom:1rem;line-height:1.5"></div>
    <div style="display:flex;gap:.5rem">
      <button id="buyConfirmOk" style="flex:1;background:var(--red,#FF2D2D);border:none;color:#fff;border-radius:4px;padding:.4rem;cursor:pointer;font-size:.82rem;font-family:Audiowide,sans-serif">Kaufen</button>
      <button id="buyConfirmCancel" style="flex:1;background:none;border:1px solid #444;color:#aaa;border-radius:4px;padding:.4rem;cursor:pointer;font-size:.82rem">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Humanity Confirm Modal -->
<div id="humanityModal" hidden style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);align-items:center;justify-content:center">
  <div style="background:#111;border:1px solid #FF2D2D;border-radius:6px;padding:1.5rem;max-width:320px;width:90%">
    <div style="font-family:Audiowide,sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#FF2D2D;margin-bottom:.75rem">HUMANITY VERLUST</div>
    <div id="humanityModalText" style="font-size:.9rem;color:#eee;margin-bottom:1rem;line-height:1.5"></div>
    <div style="display:flex;gap:.5rem">
      <button id="humanityModalConfirm" style="flex:1;background:#FF2D2D;border:none;color:#fff;border-radius:4px;padding:.4rem;cursor:pointer;font-size:.82rem;font-family:Audiowide,sans-serif">Kaufen &amp; abziehen</button>
      <button id="humanityModalCancel" style="flex:1;background:none;border:1px solid #444;color:#aaa;border-radius:4px;padding:.4rem;cursor:pointer;font-size:.82rem">Abbrechen</button>
    </div>
  </div>
</div>

<script type="module">
import { getCharacter, getItems, patchCharacter, patchCash, subscribeCharacters } from './assets/js/supabase.js';

// ── Cyberware slot mapping ────────────────────────────────────
const CYBERWARE_SLOT_MAP = {
  'Fashionware':                     ['fashionware'],
  'Neuralware / Chipware':           ['neuralLink'],
  'Chipware':                        ['neuralLink'],
  'Neuralware':                      ['neuralLink'],
  'Cybereye / Cybereye Option':      ['rightCybereye','leftCybereye'],
  'Cybereye Option':                 ['rightCybereye','leftCybereye'],
  'Cyberaudio Suite / Option':       ['cyberaudio'],
  'Cyberaudio Option':               ['cyberaudio'],
  'Internal Cyberware':              ['internal'],
  'External Cyberware':              ['external'],
  'Cyberarm / Cyberarm Option':      ['rightCyberarm','leftCyberarm'],
  'Cyberarm Option':                 ['rightCyberarm','leftCyberarm'],
  'Cyberarm/Cyberleg/Cyberlimb Option':['rightCyberarm','leftCyberarm','rightCyberleg','leftCyberleg'],
  'Cyberleg/Cyberlimb Option':       ['rightCyberleg','leftCyberleg'],
  'Borgware':                        ['borgware'],
};
const SLOT_LABELS = {
  rightCybereye:'Rechtes Auge', leftCybereye:'Linkes Auge',
  rightCyberarm:'Rechter Arm',  leftCyberarm:'Linker Arm',
  rightCyberleg:'Rechtes Bein', leftCyberleg:'Linkes Bein',
  neuralLink:'Neural Link', cyberaudio:'Cyberaudio',
  internal:'Intern', external:'Extern',
  fashionware:'Fashionware', borgware:'Borgware',
};

// ── Role-spezifische Highlights (CP RED Rulebook) ─────────────
const ROLE_HIGHLIGHTS = {
  Rockerboy: ['Audio Recorder','Chemskin','Cyberaudio Suite','Tech Hair',
              'Very Heavy Pistol','Heavy Melee Weapon','Flashbang Grenade','Teargas Grenade','Light Armorjack'],
  Solo:      ['Biomonitor','Neural Link','Sandevistan','Speedware','Wolvers',
              'Assault Rifle','Very Heavy Pistol','Heavy Melee Weapon','Bulletproof Shield','Light Armorjack'],
  Netrunner: ['Interface Plugs','Neural Link','Shift Tacts',
              'Very Heavy Pistol','Light Armorjack','Body Armor','Head Armor','Cyberdeck'],
  Tech:      ['Cybereye','MicroOptics','Skinwatch','Tool Hand',
              'Shotgun','Assault Rifle','Flashbang Grenade','Light Armorjack','Techtool'],
  Medtech:   ['Biomonitor','Cybereye','Nasal Filters','Toxin Binders','TeleOptics',
              'Shotgun','Assault Rifle','Smoke Grenade','Bulletproof Shield','Light Armorjack','Medtech Bag'],
  Media:     ['Amplified Hearing','Voice Stress Analyzer','Cyberaudio Suite','Light Tattoo',
              'Heavy Pistol','Very Heavy Pistol','Light Armorjack'],
  Lawman:    ['Hidden Holster','Subdermal Pocket',
              'Assault Rifle','Shotgun','Heavy Pistol','Bulletproof Shield','Smoke Grenade','Light Armorjack'],
  Exec:      ['Biomonitor','Tech Hair','Cyberaudio Suite','Internal Agent','Toxin Binders','Nasal Filters',
              'Very Heavy Pistol','Light Armorjack'],
  Fixer:     ['Cyberaudio Suite','Internal Agent','Subdermal Pocket','Voice Stress Analyzer','Amplified Hearing',
              'Heavy Pistol','Very Heavy Pistol','Light Melee Weapon','Light Armorjack'],
  Nomad:     ['Interface Plugs','Wolvers','Neural Link',
              'Heavy Pistol','Very Heavy Pistol','Heavy Melee Weapon','Light Armorjack'],
};

// ── Foundational-Voraussetzungen für Cyberware-Options ────────
const FOUNDATIONAL_REQ = {
  'Cybereye Option':           { name: 'Cybereye',        slots: ['rightCybereye','leftCybereye'] },
  'Cyberarm Option':           { name: 'Cyberarm',        slots: ['rightCyberarm','leftCyberarm'] },
  'Cyberleg/Cyberlimb Option': { name: 'Cyberleg',        slots: ['rightCyberleg','leftCyberleg'] },
  'Cyberaudio Option':         { name: 'Cyberaudio Suite',slots: ['cyberaudio'] },
};


// ── Maximale Option-Slots pro Slot-Typ ────────────────────────
const SLOT_MAXES = {
  rightCybereye: 3, leftCybereye:  3,
  rightCyberarm: 4, leftCyberarm:  4,
  rightCyberleg: 4, leftCyberleg:  4,
  cyberaudio: 3, neuralLink: 5,
  fashionware: 7, internal: 7, external: 7,
  borgware: Infinity,
};

// ── Config ────────────────────────────────────────────────────
const SHOP_CATEGORIES = [
  'Ranged Weapon',
  'Melee Weapon',
  'Exotic Weapon',
  'Armor',
  'Cyberware',
  'Gear',
  'Ammunition',
  'Program',
  'Fashion',
  'Nomad Vehicle Access',
];

// ── State ─────────────────────────────────────────────────────
const id   = new URLSearchParams(location.search).get('id');
if (!id) { location.replace('index.html'); }
let char   = null;
let items  = [];           // all fetched items
let activeCategory = SHOP_CATEGORIES[0];
let selectedItem   = null;
let armorSlot      = 'body';
let AMMO_DATA      = null;
const _ammoQtys    = {};   // ammo id → selected pack quantity

async function loadAmmoData() {
  if (AMMO_DATA) return AMMO_DATA;
  try {
    const r = await fetch('/assets/data/ammunition.json');
    AMMO_DATA = await r.json();
  } catch { AMMO_DATA = { ammo_types: [], weapon_ammo_mapping: {} }; }
  return AMMO_DATA;
}

// ── Boot ──────────────────────────────────────────────────────
if (!id) {
  document.getElementById('shopLoader').innerHTML =
    '<span style="color:var(--red)">Kein Charakter gewählt.</span>';
} else {
  document.getElementById('backLink').href = `player.html?id=${id}`;

  try {
    [char, items] = await Promise.all([
      getCharacter(id),
      getItems(SHOP_CATEGORIES),
      loadAmmoData(),
    ]);
    renderNav();
    renderCatButtons();
    renderGrid();

    // Live-Update: Cash + Injuries vom DM
    subscribeCharacters(payload => {
      if (payload.new?.id !== char.id) return;
      const prev = char.cash;
      Object.assign(char, payload.new);
      if (char.cash !== prev) updateNavDisplay();
      renderGrid();
      if (selectedItem) openDetail(selectedItem);
    });
  } catch (e) {
    const msg = (e.code === 'NOT_FOUND' || e.code === 'PGRST116')
      ? `Charakter nicht gefunden. <a href="index.html" style="color:var(--cyan)">← Zurück zur Übersicht</a>`
      : `Fehler: ${e.message}`;
    document.getElementById('shopLoader').innerHTML = `<span style="color:var(--red)">${msg}</span>`;
  }
}

// ── Gating helpers ────────────────────────────────────────────
function parseMaxHumanityLoss(str) {
  if (!str || str.startsWith('0')) return 0;
  const diceMatch = str.match(/\((\d+)d(\d+)/);
  if (diceMatch) return parseInt(diceMatch[1]) * parseInt(diceMatch[2]);
  const num = parseInt(str);
  return isNaN(num) ? 0 : num;
}

// ── Role-Highlight-Check ──────────────────────────────────────
function isRoleHighlight(item) {
  const keywords = ROLE_HIGHLIGHTS[char?.role] || [];
  return keywords.some(k => item.name.toLowerCase().includes(k.toLowerCase()));
}

// ── Critical Injuries aus JSON-String parsen ──────────────────
function parseInjuries() {
  try { return JSON.parse(char.critical_injuries || '[]'); } catch { return []; }
}

// ── EMP aus Humanity berechnen ────────────────────────────────
function calcEMP(humanity) { return Math.floor((humanity ?? 0) / 10); }

// ── Cyberpsychosis-Status ─────────────────────────────────────
function getCyberpsychosisStatus(humanity) {
  const h = typeof humanity === 'number' && !isNaN(humanity) ? humanity : null;
  if (h === null) return null;
  if (h <= 0)  return { level: 5, color: '#FF0000', label: 'CYBERPSYCHOSIS — GM übernimmt Kontrolle',       pulse: true,  blink: false };
  if (h <= 9)  return { level: 4, color: '#FF0000', label: '💀 KRITISCH — eine schlechte Entscheidung noch',  pulse: false, blink: true  };
  if (h <= 19) return { level: 3, color: '#FF2D2D', label: '🔴 Cyberpsychosis-Risiko — Therapie empfohlen',  pulse: true,  blink: false };
  if (h <= 39) return { level: 2, color: '#FF8C00', label: '🟠 Gefährliche Instabilität — EMP beeinträchtigt', pulse: false, blink: false };
  if (h <= 59) return { level: 1, color: '#FFD700', label: '⚠ Humanity sinkt — achte auf Implantate',        pulse: false, blink: false };
  return null;
}

function showBuyConfirmModal(item) {
  return new Promise(resolve => {
    const modal = document.getElementById('buyConfirmModal');
    const price = item.price != null ? item.price + ' eb' : 'kostenlos';
    document.getElementById('buyConfirmText').innerHTML =
      `<strong style="color:#eee">${item.name}</strong><br>`
      + `<span style="color:var(--cyan,#00E5FF);font-family:Audiowide,sans-serif">${price}</span>`
      + (item._extraLine ? `<br><span style="font-size:.78rem;color:var(--text-muted);margin-top:.2rem;display:block">${item._extraLine}</span>` : '');
    modal.hidden = false;
    modal.style.display = 'flex';
    const cleanup = val => { modal.hidden = true; modal.style.display = ''; resolve(val); };
    document.getElementById('buyConfirmOk').onclick     = () => cleanup(true);
    document.getElementById('buyConfirmCancel').onclick = () => cleanup(false);
  });
}

// ── Foundational Piece Check ──────────────────────────────────
function getFoundationalBlock(item) {
  if (item.category !== 'Cyberware') return null;
  const sub = item.subcategory || '';

  // Neuralware-Options erkennen: Subcategory "Neuralware / Chipware" + "Requires Neural Link" in notes
  if ((sub === 'Neuralware / Chipware' || sub === 'Chipware') && item.notes?.includes('Requires Neural Link')) {
    const cw = char.cyberware || {};
    return (cw.neuralLink || []).some(c => c.name === 'Neural Link') ? null : 'Neural Link';
  }

  const req = FOUNDATIONAL_REQ[sub];
  if (!req) return null;

  // Cyberleg selbst blockiert sich nicht
  if (sub === 'Cyberleg/Cyberlimb Option' && item.name === 'Cyberleg') return null;

  const cw = char.cyberware || {};
  return req.slots.some(s => (cw[s] || []).some(c => c.name === req.name)) ? null : req.name;
}

// ── Slot-Bestimmung (korrekte Slots je nach Item-Name + Notes) ─
function getItemSlots(item) {
  const sub = item.subcategory || '';
  const base = CYBERWARE_SLOT_MAP[sub] || ['internal'];
  if (sub !== 'Cyberarm/Cyberleg/Cyberlimb Option') return base;

  // Kombinierte Subcategory: anhand von Name und Notes spezifizieren
  const notes = item.notes || '';
  if (item.name === 'Cyberleg' || notes.startsWith('Cyberleg Option') || notes.toLowerCase().startsWith('replacement leg'))
    return ['rightCyberleg','leftCyberleg'];
  if (notes.startsWith('Cyberarm Option'))
    return ['rightCyberarm','leftCyberarm'];
  return base; // genuines Cyberlimb-Option (Wolvers etc.) → alle Gliedmaßen
}

// ── Critical Injury Block ─────────────────────────────────────
function getInjuryBlock(item) {
  if (item.category !== 'Cyberware') return null;
  const sub  = (item.subcategory || '').toLowerCase();
  const notes = item.notes || '';
  const active = parseInjuries().map(i => i.name || i);

  const ARM    = ['Broken Arm','Dismembered Arm','Dismembered Hand','Crushed Fingers'];
  const LEG    = ['Broken Leg','Dismembered Leg'];
  const EYE    = ['Lost Eye','Damaged Eye'];
  const EAR    = ['Lost Ear','Damaged Ear'];
  const BRAIN  = ['Brain Injury','Cracked Skull'];

  const block = injuries => injuries.find(inj => active.includes(inj)) || null;

  // Kombinierte Subcategory: nach Item-Name und Notes differenzieren
  if (sub === 'cyberarm/cyberleg/cyberlimb option') {
    if (item.name === 'Cyberleg' || notes.startsWith('Cyberleg Option') || notes.toLowerCase().startsWith('replacement leg'))
      return block(LEG);
    if (notes.startsWith('Cyberarm Option'))
      return block(ARM);
    return null; // echtes Cyberlimb-Option (Wolvers, Jump Booster etc.) — kein Preemptiv-Block
  }

  // Alle anderen Subcategories per Substring
  if (sub.includes('cyberarm')) return block(ARM);
  if (sub.includes('cyberleg') || sub.includes('cyberlimb')) return block(LEG);
  if (sub.includes('cybereye'))   return block(EYE);
  if (sub.includes('cyberaudio')) return block(EAR);
  if (sub.includes('neuralware') || sub.includes('chipware')) return block(BRAIN);
  return null;
}

// ── Slot-Kosten eines Items (aus notes) ───────────────────────
function getSlotCost(item) {
  const m = (item.notes || '').match(/takes (\d+) Option Slot/i);
  return m ? parseInt(m[1]) : 1;
}

// ── Slot-Auslastung prüfen ────────────────────────────────────
function getSlotStatus(slot, newItemCost = 0) {
  const max = SLOT_MAXES[slot] ?? Infinity;
  if (!isFinite(max)) return { full: false, used: 0, max };
  const existing = (char.cyberware || {})[slot] || [];
  const used = existing.reduce((s, c) => s + (c.slotCost || 1), 0);
  return { full: used + newItemCost > max, used, max };
}

function getGates(item) {
  const x   = item.extra || {};
  const out = { cash: true, cashDebt: false, rank: true, humanity: true, foundational: null, injuryBlock: null, slotFull: false };

  const currentCash = char.cash ?? 0;
  const price       = item.price ?? 0;
  out.cash     = currentCash >= price;
  out.cashDebt = currentCash < 0; // Charakter hat bereits Schulden

  if (x.required_moto_rank != null) {
    out.rankRequired = x.required_moto_rank;
    out.rankCurrent  = char.role_ability_rank ?? 0;
    out.rank = (char.role === 'Nomad') && (out.rankCurrent >= out.rankRequired);
  }

  if (item.category === 'Cyberware' && x.humanity_loss) {
    const maxLoss = parseMaxHumanityLoss(x.humanity_loss);
    if (maxLoss > 0) {
      out.humanityLoss    = maxLoss;
      out.humanityCurrent = char.current_humanity ?? 0;
      out.humanity        = out.humanityCurrent >= maxLoss;
    }
  }

  if (item.category === 'Cyberware') {
    out.foundational = getFoundationalBlock(item);
    out.injuryBlock  = getInjuryBlock(item);

    // Slot-Auslastung: bei Single-Slot-Items vorab prüfen
    const slots = getItemSlots(item);
    if (slots?.length === 1) {
      const st = getSlotStatus(slots[0], getSlotCost(item));
      if (st.full) { out.slotFull = true; out.slotStatus = st; }
    }
  }

  return out;
}

// ── Nav ───────────────────────────────────────────────────────
function renderNav() {
  document.title = `Shop — ${char.name}`;
  document.getElementById('navCharName').textContent = char.name;
  updateNavDisplay();
}

function updateNavDisplay() {
  document.getElementById('navCash').textContent = `💰 ${char.cash ?? 0} eb`;
  const st  = getCyberpsychosisStatus(char.current_humanity ?? 0);
  const el  = document.getElementById('psychosisStatus');
  if (st) {
    el.textContent = st.label;
    const anim = st.blink ? ';animation:psychosis-blink .5s step-end infinite' : st.pulse ? ';animation:psychosis-pulse 1s ease-in-out infinite' : '';
    el.style.cssText = `color:${st.color};font-size:.72rem;margin-left:.75rem;font-family:Audiowide,sans-serif;letter-spacing:.06em${anim}`;
  } else {
    el.textContent = '';
    el.style.cssText = '';
  }
}

// ── Category sidebar ──────────────────────────────────────────
function renderCatButtons() {
  const wrap = document.getElementById('catButtons');
  wrap.innerHTML = SHOP_CATEGORIES.map(cat => `
    <button class="cat-btn${cat === activeCategory ? ' active' : ''}" data-cat="${cat}">${cat}</button>
  `).join('');

  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.cat-btn');
    if (!btn) return;
    activeCategory = btn.dataset.cat;
    selectedItem   = null;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderGrid();
    closeDetail();
  });
}

// ── Ammo grid (client-side, from ammunition.json) ─────────────
function buildAmmoInventoryBar() {
  const inv = char.ammo_inventory || {};
  const types = ['pistol','rifle','shotgun','arrow'];
  const parts = types.map(t => {
    const qty = inv[t] || 0;
    const warn = qty === 0 ? '⚠' : '';
    return `<span style="color:${qty===0?'var(--red)':'var(--text-muted)'}">${t.charAt(0).toUpperCase()+t.slice(1)}: ${qty}${warn}</span>`;
  });
  return `<div class="ammo-inventory-bar">Vorrat: ${parts.join(' &nbsp;|&nbsp; ')}</div>`;
}

function renderAmmoGrid() {
  const wrap = document.getElementById('shopGridWrap');
  const ammoTypes = AMMO_DATA?.ammo_types || [];
  if (!ammoTypes.length) {
    wrap.innerHTML = `<p class="shop-empty">Munitionsdaten nicht verfügbar.</p>`;
    return;
  }

  const inv = char.ammo_inventory || {};
  const groups = {};
  for (const a of ammoTypes) {
    if (!groups[a.ammo_type]) groups[a.ammo_type] = [];
    groups[a.ammo_type].push(a);
  }
  const typeLabels = { pistol:'Pistol', rifle:'Rifle', shotgun:'Shotgun', arrow:'Arrow', grenade:'Grenade', rocket:'Rocket' };

  const buildAmmoCard = a => {
    const stock      = inv[a.ammo_type] || 0;
    const specialLabel = a.special ? a.special.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) : '';
    const qty        = _ammoQtys[a.id] || 1;
    const totalCost  = a.price * qty;
    const totalShots = a.quantity_per_purchase * qty;
    const canAfford  = (char.cash || 0) >= totalCost;
    return `
    <div class="shop-card ammo-card" data-ammo-id="${a.id}">
      <div class="shop-card-name">${a.name}</div>
      <div class="ammo-type-badge ammo-${a.ammo_type}">${(typeLabels[a.ammo_type]||a.ammo_type).toUpperCase()}</div>
      ${specialLabel ? `<div class="ammo-special-badge" style="margin:.2rem 0">${specialLabel}</div>` : ''}
      <div class="ammo-effect" style="font-size:.68rem;color:var(--text-muted);margin:.2rem 0;line-height:1.4">${a.effect}</div>
      <div class="ammo-stock">Vorrat: <strong style="color:${stock===0?'var(--red)':'var(--cyan)'}">${stock} Schuss</strong></div>
      <div class="ammo-buy-section">
        <div class="ammo-price-per-pack">${a.price} eb pro Pack · ${a.quantity_per_purchase} Schuss</div>
        <div class="ammo-buy-controls">
          <button class="ammo-qty-btn ammo-qty-minus" data-ammo-id="${a.id}">−</button>
          <div class="ammo-qty-display">
            <span class="ammo-qty-num">${qty}</span>
            <span class="ammo-qty-sub">${qty === 1 ? 'Pack' : 'Packs'} · ${totalShots} Schuss</span>
          </div>
          <button class="ammo-qty-btn ammo-qty-plus" data-ammo-id="${a.id}">+</button>
        </div>
        <div class="ammo-buy-total" style="color:${canAfford?'var(--cyan)':'var(--red)'}">${totalCost.toLocaleString('de-DE')} eb</div>
        <button class="btn btn-primary ammo-buy-btn" data-ammo-id="${a.id}" ${!canAfford?'disabled':''} style="width:100%;margin-top:.4rem;font-size:.8rem">${canAfford ? 'Kaufen' : 'Nicht genug eb'}</button>
      </div>
    </div>`;
  };

  wrap.innerHTML = buildAmmoInventoryBar() + Object.entries(groups).map(([type, list]) => `
    <div class="shop-section-head">${typeLabels[type] || type}</div>
    <div class="shop-grid">${list.map(buildAmmoCard).join('')}</div>
  `).join('');

}

// Wire ammo grid interactions once — delegated on the wrap container
(function setupAmmoGridEvents() {
  const wrap = document.getElementById('shopGridWrap');
  wrap.addEventListener('click', e => {
    if (activeCategory !== 'Ammunition') return;
    const ammoTypes = AMMO_DATA?.ammo_types || [];
    const minusBtn = e.target.closest('.ammo-qty-minus');
    const plusBtn  = e.target.closest('.ammo-qty-plus');
    const buyBtn   = e.target.closest('.ammo-buy-btn');
    if (minusBtn) {
      const id = minusBtn.dataset.ammoId;
      _ammoQtys[id] = Math.max(1, (_ammoQtys[id] || 1) - 1);
      renderAmmoGrid();
    } else if (plusBtn) {
      const id = plusBtn.dataset.ammoId;
      _ammoQtys[id] = Math.min(20, (_ammoQtys[id] || 1) + 1);
      renderAmmoGrid();
    } else if (buyBtn && !buyBtn.disabled) {
      const ammoItem = ammoTypes.find(a => a.id === buyBtn.dataset.ammoId);
      if (!ammoItem) return;
      const qty = _ammoQtys[ammoItem.id] || 1;
      buyAmmo(ammoItem, qty).then(() => { _ammoQtys[ammoItem.id] = 1; renderAmmoGrid(); });
    }
  });
})();

async function buyAmmo(ammoItem, qty) {
  const total = ammoItem.price * qty;
  const shots = ammoItem.quantity_per_purchase * qty;
  if ((char.cash || 0) < total) {
    alert('Nicht genug eb!');
    return;
  }
  const confirmed = await showBuyConfirmModal({
    name: `${qty}× ${ammoItem.name}`,
    price: total,
    _extraLine: `+${shots} Schuss ${ammoItem.ammo_type.charAt(0).toUpperCase() + ammoItem.ammo_type.slice(1)}`,
  });
  if (!confirmed) return;
  const inv = { ...(char.ammo_inventory || {}) };
  inv[ammoItem.ammo_type] = (inv[ammoItem.ammo_type] || 0) + shots;
  char.ammo_inventory = inv;
  const newCash = char.cash - total;
  char.cash_log = await patchCash(char.id, newCash, -total, `Ammo: ${ammoItem.name} ×${qty}`, char.cash_log);
  char.cash = newCash;
  await patchCharacter(char.id, { ammo_inventory: inv });
  updateNavDisplay();
  renderAmmoGrid();
}

// ── Item grid ─────────────────────────────────────────────────
function renderGrid() {
  if (activeCategory === 'Ammunition') { renderAmmoGrid(); return; }

  const wrap = document.getElementById('shopGridWrap');
  const list = items.filter(i => i.category === activeCategory);

  if (!list.length) {
    wrap.innerHTML = `<p class="shop-empty">Keine Items in dieser Kategorie.</p>`;
    return;
  }

  // Group by subcategory
  const groups = {};
  for (const item of list) {
    const sub = item.subcategory || '';
    if (!groups[sub]) groups[sub] = [];
    groups[sub].push(item);
  }

  wrap.innerHTML = Object.entries(groups).map(([sub, groupItems]) => `
    ${sub ? `<div class="shop-section-head">${sub}</div>` : ''}
    <div class="shop-grid">
      ${groupItems.map(item => {
        const g          = getGates(item);
        const highlighted = isRoleHighlight(item);
        const isLocked   = !g.rank || !g.humanity || !!g.foundational || !!g.injuryBlock;
        const cashOut    = !g.cash;
        const slotFull   = g.slotFull;

        let lockTip = '';
        if (!g.rank)            lockTip = `Benötigt Nomad Rank ${g.rankRequired} (du hast Rank ${g.rankCurrent})`;
        else if (!g.humanity)   lockTip = `Nicht genug Humanity (riskiert Cyberpsychose)`;
        else if (g.foundational) lockTip = `Benötigt zuerst: ${g.foundational}`;
        else if (g.injuryBlock) lockTip = `Critical Injury: ${g.injuryBlock} — erst heilen`;

        const installBadge = (() => {
          const inst = item.extra?.install;
          if (inst === 'Clinic')   return `<div class="install-badge install-clinic">Ripperdoc / Medtech</div>`;
          if (inst === 'Hospital') return `<div class="install-badge install-hospital">⚠ Hospital</div>`;
          return '';
        })();

        const slotBadge = slotFull
          ? `<div style="font-size:.62rem;color:#FF8C00;margin-top:.2rem">Maximale Slots (${g.slotStatus.used}/${g.slotStatus.max})</div>`
          : '';

        return `
        <div class="shop-card${selectedItem?.id === item.id ? ' active' : ''}${cashOut ? ' card-no-cash' : ''}${isLocked ? ' card-locked' : ''}${slotFull ? ' slot-full' : ''}${highlighted ? ' role-highlight' : ''}"
             data-id="${item.id}">
          <div class="shop-card-name">${item.name}</div>
          <div class="shop-card-price">${item.price != null ? item.price + ' eb' : '—'}</div>
          ${installBadge}${slotBadge}
          ${item.notes ? `<div class="shop-card-notes">${item.notes}</div>` : ''}
          ${isLocked ? `<div class="lock-icon" title="${lockTip}">🔒</div>` : ''}
          ${highlighted ? `<span class="role-badge" title="Core Item für ${char.role} laut CP RED Rulebook">⭐</span>` : ''}
        </div>`;
      }).join('')}
    </div>
  `).join('');

  wrap.addEventListener('click', e => {
    const card = e.target.closest('.shop-card');
    if (!card) return;
    const item = items.find(i => i.id === card.dataset.id);
    if (!item) return;
    document.querySelectorAll('.shop-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    selectedItem = item;
    armorSlot = 'body';
    openDetail(item);
  });
}

// ── Detail panel ──────────────────────────────────────────────
function openDetail(item) {
  const panel = document.getElementById('shopDetail');
  const main  = document.getElementById('shopMain');
  const x     = item.extra || {};

  panel.className = 'shop-detail visible';
  main.classList.add('detail-open');

  // Build field rows based on category
  const fields = [];
  if (item.damage)   fields.push(['Damage',   item.damage]);
  if (item.rof)      fields.push(['ROF',      item.rof]);
  if (item.hands)    fields.push(['Hands',    item.hands]);
  if (item.ammo)     fields.push(['Ammo',     item.ammo]);
  if (x.sp)         fields.push(['SP',        x.sp]);
  if (x.armor_penalty && x.armor_penalty !== 'None')
                     fields.push(['Penalty',  x.armor_penalty]);
  if (x.install && x.install !== 'Mall') {
    const cls = x.install === 'Hospital' ? 'install-hospital' : 'install-clinic';
    const msg = x.install === 'Hospital'
      ? '⚠ Hospital — seltene Einrichtung'
      : 'Benötigt Ripperdoc oder Medtech zur Installation';
    fields.push(['Install', `<span class="install-badge ${cls}">${msg}</span>`]);
  }
  if (x.humanity_loss) fields.push(['Humanity', x.humanity_loss]);
  if (x.concealable) fields.push(['Concealable', 'Ja']);
  if (x.magazine)    fields.push(['Magazine', x.magazine]);
  if (item.source?.page) fields.push(['Quelle', `Core S.${item.source.page}`]);

  const fieldsHtml = fields.length
    ? `<div class="detail-fields">${fields.map(([k,v]) =>
        `<div class="df-row"><span class="df-key">${k}</span><span class="df-val">${v}</span></div>`
      ).join('')}</div>`
    : '';

  const armorSlotHtml = item.category === 'Armor' ? `
    <div>
      <div class="df-key" style="margin-bottom:.4rem">Slot</div>
      <div class="armor-slots">
        ${['head','body','shield'].map(s => `
          <button class="slot-btn${armorSlot === s ? ' active' : ''}" data-slot="${s}">${s.toUpperCase()}</button>
        `).join('')}
      </div>
    </div>` : '';

  const g          = getGates(item);
  const priceLabel = item.price != null ? item.price + ' eb' : 'Kostenlos';

  let btnClass = 'buy-btn', btnLabel = 'Kaufen', btnDisabled = false;
  let debtWarningHtml = '';
  if (g.cashDebt) {
    debtWarningHtml = `<div style="font-size:.75rem;color:#FF8C00;margin-bottom:.35rem">⚠ Schulden: ${(char.cash ?? 0).toLocaleString('de-DE')} eb</div>`;
  }
  if (!g.cash) {
    btnClass += ' no-cash';     btnLabel = 'Nicht genug eb';                             btnDisabled = true;
  } else if (!g.rank) {
    btnClass += ' no-rank';     btnLabel = `🔒 Rank ${g.rankRequired} erforderlich`;     btnDisabled = true;
  } else if (g.foundational) {
    btnClass += ' no-rank';     btnLabel = `🔒 Benötigt: ${g.foundational}`;             btnDisabled = true;
  } else if (g.injuryBlock) {
    btnClass += ' no-rank';     btnLabel = `🔒 Critical Injury: ${g.injuryBlock}`;       btnDisabled = true;
  } else if (g.slotFull) {
    btnClass += ' no-rank';     btnLabel = `🔒 Maximale Slots (${g.slotStatus.used}/${g.slotStatus.max})`; btnDisabled = true;
  } else if (!g.humanity) {
    btnClass += ' no-humanity'; btnLabel = '🔒 Nicht genug Humanity';                    btnDisabled = true;
  }
  const showOverride = g.rank && g.cash && !g.humanity && !g.foundational && !g.injuryBlock && !g.slotFull;

  // Humanity-Vorschau: Würfelausdruck aus Klammern extrahieren
  const humanityPreviewHtml = (() => {
    if (item.category !== 'Cyberware' || !x.humanity_loss || x.humanity_loss.startsWith('0')) return '';
    const parenM = String(x.humanity_loss).match(/\(([^)]+)\)/);
    const costDisplay = parenM ? parenM[1] : x.humanity_loss;
    const curH = char.current_humanity ?? 0;
    return `<div class="humanity-cost-preview">Kostet <strong>${costDisplay} Humanity</strong> (du hast noch ${curH})</div>`;
  })();

  // Slot-Info im Detail
  const slotInfoHtml = (() => {
    if (item.category !== 'Cyberware') return '';
    const slots = getItemSlots(item);
    if (!slots?.length) return '';
    return slots.map(s => {
      const max = SLOT_MAXES[s];
      if (!max || !isFinite(max)) return '';
      const st = getSlotStatus(s);
      const cls = st.used >= max ? 'slot-info slot-warn' : 'slot-info';
      return `<div class="${cls}">${SLOT_LABELS[s]}: ${st.used}/${max} Slots belegt</div>`;
    }).join('');
  })();

  panel.innerHTML = `
    <div>
      <div class="detail-name">${item.name}</div>
      <div class="detail-sub">${[item.category, item.subcategory].filter(Boolean).join(' · ')}</div>
    </div>
    <div class="detail-price">${priceLabel}</div>
    ${fieldsHtml}
    ${slotInfoHtml}
    ${armorSlotHtml}
    ${item.notes ? `<div class="detail-notes">${item.notes}</div>` : ''}
    <div style="margin-top:auto">
      ${debtWarningHtml}${humanityPreviewHtml}
      <button class="${btnClass}" id="buyBtn" ${btnDisabled ? 'disabled' : ''}>${btnLabel}</button>
      ${showOverride ? `<button class="override-btn" id="overrideBtn">DM Override: Trotzdem kaufen</button>` : ''}
      <div class="buy-msg" id="buyMsg"></div>
    </div>
  `;

  // Slot selector
  panel.querySelectorAll('.slot-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      armorSlot = btn.dataset.slot;
      panel.querySelectorAll('.slot-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  // Buy button
  document.getElementById('buyBtn').addEventListener('click', () => buyItem(item));
  document.getElementById('overrideBtn')?.addEventListener('click', () => buyItem(item, true));
}

function closeDetail() {
  document.getElementById('shopDetail').className = 'shop-detail';
  document.getElementById('shopMain').classList.remove('detail-open');
}

// ── Purchase ──────────────────────────────────────────────────
function routeItem(item) {
  if (['Ranged Weapon','Melee Weapon','Exotic Weapon'].includes(item.category)) return 'weapons';
  if (item.category === 'Armor')     return 'armor';
  if (item.category === 'Cyberware') return 'cyberware';
  return 'gear';
}

function buildSnapshot(item) {
  const x = item.extra || {};
  switch (routeItem(item)) {
    case 'weapons': {
      const mapping = AMMO_DATA?.weapon_ammo_mapping?.[item.name];
      return {
        name: item.name, damage: item.damage || null, ammo: item.ammo || null,
        rof: item.rof || null, notes: item.notes || null,
        price: item.price, raw_cost: item.raw_cost, category: item.category,
        magazine_max:  mapping?.magazine  ?? null,
        ammo_current:  mapping?.magazine  ?? null,
        loaded_ammo:   mapping ? 'basic' : null,
        is_autofire:   mapping?.autofire  ?? false,
      };
    }
    case 'armor':
      return { name: item.name, category: item.category,
               sp: parseInt(x.sp) || 0,
               penalty: (x.armor_penalty && x.armor_penalty !== 'None') ? parseInt(x.armor_penalty) || 0 : 0,
               notes: item.notes || null, price: item.price, raw_cost: item.raw_cost };
    case 'cyberware':
      return { name: item.name, category: item.category, notes: item.notes || null,
               install: x.install || null, humanity_loss: x.humanity_loss || null,
               price: item.price, raw_cost: item.raw_cost, subcategory: item.subcategory || null,
               slotCost: getSlotCost(item) };
    default:
      return { name: item.name, category: item.category, notes: item.notes || null,
               price: item.price, raw_cost: item.raw_cost };
  }
}

function rollHumanityLoss(expr) {
  if (!expr || String(expr).startsWith('0')) return 0;
  // Format "7 (2d6)" → Würfelausdruck aus Klammern extrahieren
  const parenM = String(expr).match(/\((\d+d\d+(?:[+-]\d+)?)\)/i);
  const diceExpr = parenM ? parenM[1] : String(expr);
  const m = diceExpr.match(/^(\d+)d(\d+)(?:\+(\d+))?(?:-(\d+))?$/i);
  if (!m) { const n = parseInt(expr); return isNaN(n) ? 0 : n; }
  let sum = 0;
  for (let i = 0; i < +m[1]; i++) sum += Math.ceil(Math.random() * +m[2]);
  return Math.max(0, sum + (+m[3] || 0) - (+m[4] || 0));
}

function showSlotPickerModal(slots, itemName) {
  return new Promise(resolve => {
    const modal = document.getElementById('slotModal');
    document.getElementById('slotModalTitle').textContent = `${itemName} — Slot wählen`;
    const btnsEl = document.getElementById('slotModalBtns');
    btnsEl.innerHTML = slots.map(s =>
      `<button data-slot="${s}" style="background:#1a1a1a;border:1px solid #00E5FF;color:#00E5FF;border-radius:4px;padding:.35rem .75rem;cursor:pointer;font-size:.78rem">${SLOT_LABELS[s] || s}</button>`
    ).join('');
    modal.hidden = false;
    modal.style.display = 'flex';
    const cleanup = (val) => {
      modal.hidden = true; modal.style.display = '';
      btnsEl.innerHTML = '';
      resolve(val);
    };
    btnsEl.onclick = e => {
      const s = e.target.closest('[data-slot]')?.dataset.slot;
      if (s) cleanup(s);
    };
    document.getElementById('slotModalCancel').onclick = () => cleanup(null);
  });
}

function showHumanityConfirmModal(amount, expr) {
  return new Promise(resolve => {
    const modal   = document.getElementById('humanityModal');
    const isRoll  = String(expr).match(/d/i);
    const parenM  = String(expr).match(/\(([^)]+)\)/);
    const exprDisp = parenM ? parenM[1] : expr;
    const curH    = char.current_humanity ?? 0;
    const newH    = Math.max(0, curH - amount);
    const oldEMP  = calcEMP(curH);
    const newEMP  = calcEMP(newH);
    const empWarn = oldEMP !== newEMP
      ? `<div style="color:#FF8C00;margin-top:.5rem;font-size:.82rem">⚠ EMP sinkt: ${oldEMP} → ${newEMP}</div>`
      : '';
    const _newSt = getCyberpsychosisStatus(newH);
    const _curSt = getCyberpsychosisStatus(curH);
    const psychoWarn = (_newSt && !_curSt)
      ? `<div style="color:#FF2D2D;margin-top:.4rem;font-size:.78rem">⚠ ${_newSt.label ?? ''}</div>`
      : '';

    document.getElementById('humanityModalText').innerHTML =
      `Verlust: <strong style="color:#FF2D2D;font-size:1.1rem">${amount}</strong>`
      + (isRoll ? ` <span style="color:#aaa;font-size:.8rem">(gewürfelt: ${exprDisp})</span>` : '')
      + `<br>Humanity: ${curH} → <strong style="color:${newH <= 19 ? '#FF2D2D' : newH <= 39 ? '#FF8C00' : '#eee'}">${newH}</strong>`
      + empWarn + psychoWarn;
    modal.hidden = false;
    modal.style.display = 'flex';
    const cleanup = (val) => { modal.hidden = true; modal.style.display = ''; resolve(val); };
    document.getElementById('humanityModalConfirm').onclick = () => cleanup(true);
    document.getElementById('humanityModalCancel').onclick  = () => cleanup(false);
  });
}

async function buyItem(item, override = false) {
  const msg   = document.getElementById('buyMsg');
  const btn   = document.getElementById('buyBtn');
  const price = item.price ?? 0;
  const g     = getGates(item);

  if (!g.cash) {
    msg.textContent = 'Nicht genug eb';
    msg.className   = 'buy-msg';
    return;
  }
  if (!g.rank) {
    msg.textContent = `Benötigt Nomad Rank ${g.rankRequired}`;
    msg.className   = 'buy-msg';
    return;
  }
  if (!override && g.foundational) {
    msg.textContent = `Benötigt zuerst: ${g.foundational}`;
    msg.className   = 'buy-msg';
    return;
  }
  if (!override && g.injuryBlock) {
    msg.textContent = `Critical Injury: ${g.injuryBlock} — erst heilen`;
    msg.className   = 'buy-msg';
    return;
  }

  // ── Kaufbestätigung ──
  if (!override) {
    const confirmed = await showBuyConfirmModal(item);
    if (!confirmed) return;
  }

  const dest     = routeItem(item);
  const snapshot = buildSnapshot(item);
  const patch    = { cash: (char.cash ?? 0) - price };

  // ── Cyberware: slot picker + humanity roll ──
  if (dest === 'cyberware') {
    const x = item.extra || {};
    const slots = getItemSlots(item);

    // Slot picker when multiple options
    let chosenSlot = slots[0];
    if (slots.length > 1) {
      chosenSlot = await showSlotPickerModal(slots, item.name);
      if (!chosenSlot) return;
    }

    // Slot-Auslastung nach Slot-Wahl prüfen
    if (!override) {
      const slotSt = getSlotStatus(chosenSlot, getSlotCost(item));
      if (slotSt.full) {
        msg.textContent = `Maximale Slots erreicht (${slotSt.used}/${slotSt.max}) in ${SLOT_LABELS[chosenSlot] || chosenSlot}`;
        msg.className   = 'buy-msg';
        return;
      }
    }

    // Humanity loss
    let humanityLost = 0;
    if (x.humanity_loss) {
      humanityLost = rollHumanityLoss(x.humanity_loss);
      if (humanityLost > 0) {
        const confirmed = await showHumanityConfirmModal(humanityLost, x.humanity_loss);
        if (!confirmed) return;
        patch.current_humanity = Math.max(0, (char.current_humanity ?? 0) - humanityLost);
      }
    }

    // Normalize existing cyberware to object (handles old flat-array saves)
    const existingCw = (char.cyberware && !Array.isArray(char.cyberware))
      ? char.cyberware : {};
    patch.cyberware = {
      ...existingCw,
      [chosenSlot]: [...(existingCw[chosenSlot] || []), snapshot],
    };
  } else if (dest === 'weapons') {
    patch.weapons = [...(char.weapons || []), snapshot];
  } else if (dest === 'gear') {
    patch.gear = [...(char.gear || []), snapshot];
  } else if (dest === 'armor') {
    patch.armor = { ...(char.armor || {}), [armorSlot]: snapshot };
  }

  btn.disabled    = true;
  msg.textContent = '';

  try {
    // Cash-Log: patchCash loggt den Kauf automatisch, anderes via patchCharacter
    const cashPatch = { ...patch };
    delete cashPatch.cash;
    const newCash   = patch.cash;
    const newCashLog = await patchCash(char.id, newCash, -(price), item.name, char.cash_log);
    if (Object.keys(cashPatch).length) await patchCharacter(char.id, cashPatch);
    patch.cash_log = newCashLog;
    Object.assign(char, patch);
    updateNavDisplay();
    msg.textContent = `✓ ${item.name} gekauft`;
    msg.className   = 'buy-msg buy-success';
    renderGrid();
    openDetail(item);

    // Cyberpsychosis bei 0 Humanity
    if (patch.current_humanity !== undefined && patch.current_humanity <= 0) {
      const pm = document.getElementById('psychosisModal');
      pm.hidden = false;
      pm.style.display = 'flex';
      document.getElementById('psychosisModalClose').onclick = () => {
        pm.hidden = true; pm.style.display = '';
      };
    }
  } catch (e) {
    msg.textContent = `Fehler: ${e.message}`;
    msg.className   = 'buy-msg';
    btn.disabled    = false;
  }
}
