<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Upload — LZRV D&amp;D Hub</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/upload.css">
  <style>
    .info-icon { background:none; border:none; color:var(--cyan,#00e5ff); cursor:pointer;
      font-size:.68rem; padding:0 .18rem; opacity:.6; line-height:1; vertical-align:middle;
      transition:opacity .15s; font-style:normal; }
    .info-icon:hover { opacity:1; }
    .info-tip-panel { position:fixed; z-index:9999; background:#090909;
      border:1px solid var(--cyan,#00e5ff); border-radius:4px; padding:.75rem 1rem;
      max-width:min(320px, calc(100vw - 24px)); font-size:.78rem; color:#ddd;
      line-height:1.55; box-shadow:0 4px 28px rgba(0,229,255,.14); display:none; }
    .info-tip-panel.is-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      max-width:min(360px, calc(100vw - 32px)); max-height:80vh; overflow-y:auto; }
    .info-tip-panel h4 { font-size:.73rem; letter-spacing:.1em; text-transform:uppercase;
      color:#ff2d2d; margin:0 0 .5rem; }
    .info-tip-panel p { margin:0 0 .3rem; }
    .info-tip-panel ul { margin:.2rem 0 .3rem; padding-left:1.1rem; }
    .info-tip-panel li { margin-bottom:.16rem; }
    .info-tip-panel strong { color:#fff; }
    .info-tip-close { float:right; background:none; border:none; color:#888; cursor:pointer;
      font-size:1rem; padding:0; margin:-.1rem -.1rem 0 .5rem; line-height:1; }
    .info-tip-overlay { display:none; position:fixed; inset:0; z-index:9998; background:rgba(0,0,0,.55); }
    .info-tip-overlay.open { display:block; }

    /* Specialty cards */
    .spec-budget { font-family: var(--font-display); font-size: .7rem; color: var(--cyan); }
    .spec-budget.over { color: var(--red); }
    .spec-budget-wrap { margin: .2rem 0 .55rem; }
    .spec-budget-bar-outer { height: 5px; background: var(--bg-input); border-radius: 3px; overflow: hidden; margin-bottom: .3rem; }
    .spec-budget-bar-inner { height: 100%; width: 0%; background: var(--cyan); border-radius: 3px; transition: width .2s; }
    .spec-budget-bar-inner.over { background: var(--red); }
    .spec-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: .5rem; margin-bottom: .5rem; }
    .spec-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: .7rem .45rem .6rem; display: flex; flex-direction: column; align-items: center;
      gap: .22rem; text-align: center; transition: border-color .15s; }
    .spec-card:not(.maxed):hover { border-color: var(--cyan); }
    .spec-card.maxed { opacity: .45; }
    .spec-card-icon { font-size: 1.4rem; line-height: 1; }
    .spec-card-name { font-family: var(--font-display); font-size: .6rem; letter-spacing: .08em; color: var(--text-head); }
    .spec-card-desc { font-size: .57rem; color: var(--text-muted); line-height: 1.3; min-height: 2.5em; }
    .spec-card-controls { display: flex; align-items: center; gap: .45rem; margin-top: .15rem; }
    .spec-card-value { font-family: var(--font-display); font-size: 1.5rem; color: var(--cyan); min-width: 2ch; text-align: center; }
    .spec-card-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border);
      background: var(--bg-input); color: var(--text); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
      transition: border-color .12s, color .12s; flex-shrink: 0; padding: 0; }
    .spec-card-btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
    .spec-card-btn:disabled { opacity: .22; cursor: not-allowed; }
    .spec-toggle-btn { margin-top: .12rem; padding: .28rem .5rem; border: 1.5px solid var(--border);
      border-radius: var(--radius); background: var(--bg-input); color: var(--text-muted);
      font-size: .67rem; cursor: pointer; transition: all .15s; }
    .spec-toggle-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,.1); }
  </style>
</head>
<body>

<nav class="nav">
  <img src="assets/img/logo.png" alt="LZRV Hub" class="nav-logo-img">
  <a href="index.html" class="btn btn-ghost" style="margin-left:auto">← Zurück</a>
</nav>

<main class="upload-page">

  <div class="upload-title">
    <h1>Character hochladen</h1>
    <p>Ausgefülltes Cyberpunk RED PDF → Datenbank</p>
  </div>

  <!-- hidden file input — opacity:0 not display:none so Safari allows programmatic click -->
  <input type="file" id="pdfInput" accept=".pdf"
    style="opacity:0;position:absolute;width:1px;height:1px;overflow:hidden">

  <!-- PDF drop zone -->
  <div class="drop-zone card" id="dropZone">
    <span class="drop-icon">📄</span>
    <p><strong>PDF hier ablegen</strong></p>
    <label for="pdfInput" class="btn btn-ghost" style="margin-top:.75rem;cursor:pointer;display:inline-flex">
      PDF auswählen
    </label>
    <p style="font-size:.75rem;margin-top:.5rem;color:var(--text-muted)">Cyberpunk RED Charakterbogen (ausgefüllt)</p>
    <p class="filename" id="pdfName" hidden></p>
  </div>

  <!-- Character name (pre-filled from PDF, editable) -->
  <div class="field-group">
    <label for="charName">Character-Name (Handle) <span class="text-red">*</span></label>
    <input type="text" id="charName" placeholder="Wird aus PDF gelesen…" autocomplete="off">
  </div>

  <!-- Player name -->
  <div class="field-group">
    <label for="playerName">Spieler-Name</label>
    <input type="text" id="playerName" placeholder="z.B. Philip" autocomplete="off">
  </div>

  <!-- Role selection (shown after PDF parse) -->
  <div class="field-group" id="roleSection" style="display:none">
    <label for="charRole">Rolle <span class="text-red">*</span></label>
    <select id="charRole">
      <option value="">— Rolle wählen —</option>
      <option value="Rockerboy">Rockerboy</option>
      <option value="Solo">Solo</option>
      <option value="Netrunner">Netrunner</option>
      <option value="Tech">Tech</option>
      <option value="Medtech">Medtech</option>
      <option value="Media">Media</option>
      <option value="Exec">Exec</option>
      <option value="Lawman">Lawman</option>
      <option value="Fixer">Fixer</option>
      <option value="Nomad">Nomad</option>
    </select>
  </div>

  <div class="field-group" id="rankSection" style="display:none">
    <label for="charRank">Ability Rank</label>
    <div style="display:flex;align-items:center;gap:.75rem">
      <input type="number" id="charRank" min="1" max="10" value="4" style="max-width:70px">
      <span class="text-muted" style="font-size:.8rem">Standard: 4 (Edgerunner)</span>
    </div>
  </div>

  <div id="uploadSpecSection"></div>

  <!-- Portrait fallback (shown when PDF has no embedded image) -->
  <div class="image-fallback card" id="imageFallback">
    <div class="image-fallback-header">
      <img src="" alt="Portrait preview" class="image-preview" id="imgPreview" hidden>
      <div>
        <h3>Portrait</h3>
        <p class="text-muted" style="font-size:.85rem" id="imgHint">
          Wird aus dem PDF extrahiert — oder hier manuell hochladen:
        </p>
      </div>
    </div>
    <div class="image-upload-zone">
      <label class="btn btn-ghost" style="cursor:pointer">
        Bild wählen
        <input type="file" id="manualImg" accept="image/jpeg,image/png,image/webp" class="sr-only">
      </label>
      <span class="text-muted" id="manualImgName" style="font-size:.85rem"></span>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap" hidden>
    <div class="progress-label">
      <span id="progressLabel">Verarbeite PDF…</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-msg" id="statusMsg" role="alert"></div>

  <!-- Submit -->
  <button class="btn btn-primary btn-upload" id="submitBtn" disabled>
    Character speichern
  </button>

</main>

<script type="module">
console.log('[upload] module loaded');
import { parsePDF }     from './assets/js/pdf-parser.js';
import { saveCharacter, patchCharacter, uploadPortrait } from './assets/js/supabase.js';

// ── State ─────────────────────────────────────────────────────
let pdfFile       = null;
let manualImgBlob = null;
let parsedResult  = null;   // { character, imageBlob }
let roleAbilities = {};

// ── Tooltip system (standalone) ───────────────────────────────
let _uTipPanel = null, _uTipOverlay = null;
const _uTipMap = new Map();

function _uInitTip() {
  if (_uTipPanel) return;
  _uTipOverlay = document.createElement('div');
  _uTipOverlay.className = 'info-tip-overlay';
  _uTipOverlay.addEventListener('click', _uHideTip);
  _uTipPanel = document.createElement('div');
  _uTipPanel.className = 'info-tip-panel';
  _uTipPanel.addEventListener('click', e => { if (e.target.classList.contains('info-tip-close')) _uHideTip(); });
  document.body.append(_uTipOverlay, _uTipPanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') _uHideTip(); });
  document.addEventListener('click', e => {
    if (_uTipPanel.style.display === 'block' &&
        !_uTipPanel.contains(e.target) && !e.target.classList.contains('info-icon'))
      _uHideTip();
  });
}
function _uHideTip() {
  if (_uTipPanel) _uTipPanel.style.display = '';
  if (_uTipOverlay) _uTipOverlay.classList.remove('open');
}
function _uShowTip(triggerEl, html) {
  _uInitTip();
  const isMobile = window.innerWidth < 560 || !window.matchMedia('(hover: hover)').matches;
  if (isMobile) {
    _uTipPanel.innerHTML = `<button class="info-tip-close">✕</button>${html}`;
    _uTipPanel.className = 'info-tip-panel is-modal';
    _uTipOverlay.classList.add('open');
  } else {
    _uTipPanel.innerHTML = html;
    _uTipPanel.className = 'info-tip-panel';
    const r = triggerEl.getBoundingClientRect();
    _uTipPanel.style.left = Math.min(r.left, window.innerWidth - 340) + 'px';
    _uTipPanel.style.top  = (r.bottom + 6) + 'px';
  }
  _uTipPanel.style.display = 'block';
}

function buildUploadTipMap() {
  _uTipMap.clear();
  const h4 = t => `<h4>${t}</h4>`;
  const med = roleAbilities.medtech || {};
  const pharmaList = med.pharmaceuticals_list || [];
  const cryoBenefits = med.specialties?.cryosystem_operation?.benefits || {};
  _uTipMap.set('med-surgery', `${h4('Chirurgie (Surgery)')}
    <p>Jeder Punkt = +2 Surgery Skill (max 10).</p>
    <p>Behandelt: Schwere Critical Injuries (DV 13/15/17), Cyberware installieren/entfernen, Bodysculpting.</p>
    <p>Exklusiv für Medtechs.</p>`);
  _uTipMap.set('med-pharma', `${h4('Pharmazeutika')}
    <p>Jeder Punkt = +1 Medical Tech Skill + 1 Drug freigeschaltet:</p>
    <ul>${pharmaList.map((p,i) => `<li><strong>${i+1}. ${p.name}:</strong> ${p.effect || ''}</li>`).join('')}</ul>
    <p>Synthetisieren: DV 13 · 200 eb → X Dosen</p>`);
  _uTipMap.set('med-cryo', `${h4('Cryosystem Operation')}
    <p>Jeder Punkt = +1 Medical Tech Skill + Benefit:</p>
    <ul>${Object.entries(cryoBenefits).map(([k,v]) => `<li><strong>${k} Pkt:</strong> ${v}</li>`).join('')}</ul>`);

  const tech = roleAbilities.tech || {};
  const dvTable = tech.dv_time_table || {};
  const dvRows = Object.entries(dvTable).map(([k,v]) => `${k} DV${v.dv}/${v.time}`).join(' · ');
  const specs = tech.specialties || {};
  _uTipMap.set('tech-field', `${h4('Field Expertise')}
    <p>${specs.field_expertise?.description || 'Addiere Specialty-Rang zu Basic Tech / Cybertech / Electronics / Weaponstech / Vehicle Tech Checks (außer Maker-Checks).'}</p>
    <p>${specs.field_expertise?.extra || 'Bonus: Temporäre Reparatur möglich (10 Min × Rang).'}</p>`);
  _uTipMap.set('tech-upgrade', `${h4('Upgrade Expertise')}
    <p>${specs.upgrade_expertise?.description || 'Verbessere ein Item (1 Upgrade/Item):'}</p>
    <ul><li>Humanity Loss um 1d6 senken</li><li>+1 Option-Slot</li>
        <li>Reparaturzeit halbieren</li><li>Waffe concealable machen</li>
        <li>Average → Excellent Quality Waffe</li><li>SP um 1 erhöhen</li></ul>`);
  _uTipMap.set('tech-fabrication', `${h4('Fabrication Expertise')}
    <p>${specs.fabrication_expertise?.description || 'Baue Items aus Materialien (1 Preiskategorie günstiger).'}</p>
    <p><strong>DV/Zeit:</strong> ${dvRows || 'Cheap DV9/1h → Luxury DV29/1M'}</p>`);
  _uTipMap.set('tech-invention', `${h4('Invention Expertise')}
    <p>${specs.invention_expertise?.description || 'Erfinde neue Items oder Upgrades (GM-vermittelt).'}</p>
    <p>Beschreibe Funktion → GM setzt DV &amp; Preiskategorie → Bauen mit Fabrication.</p>`);
}

function setupUploadInfoIcons() {
  document.querySelectorAll('.info-icon[data-tip]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const html = _uTipMap.get(btn.dataset.tip);
      if (html) _uShowTip(btn, html);
      else _uHideTip();
    });
  });
}

// Load role abilities + set up tooltips
fetch('./assets/data/role-abilities.json').then(r => r.json()).then(data => {
  roleAbilities = data;
  buildUploadTipMap();
  setupUploadInfoIcons();
}).catch(() => {});

// ── DOM refs ──────────────────────────────────────────────────
const dropZone   = document.getElementById('dropZone');
const pdfInput   = document.getElementById('pdfInput');
const pdfName    = document.getElementById('pdfName');
const charName   = document.getElementById('charName');
const playerName = document.getElementById('playerName');
const imgPreview  = document.getElementById('imgPreview');
const imgHint     = document.getElementById('imgHint');
const manualImg   = document.getElementById('manualImg');
const manualImgName = document.getElementById('manualImgName');
const progressWrap  = document.getElementById('progressWrap');
const progressLabel = document.getElementById('progressLabel');
const progressPct   = document.getElementById('progressPct');
const progressFill  = document.getElementById('progressFill');
const statusMsg   = document.getElementById('statusMsg');
const submitBtn   = document.getElementById('submitBtn');

// ── Specialty cards ───────────────────────────────────────────
function _specBarHtml(total) {
  return `<div class="spec-budget-wrap">
    <div class="spec-budget-bar-outer"><div class="spec-budget-bar-inner" id="sp-budget-fill"></div></div>
    <div class="spec-budget" id="sp-budget">Punkte vergeben: 0 / ${total}</div>
  </div>`;
}
function _specCardHtml({ id, icon, name, desc, max }) {
  return `<div class="spec-card" id="spec-card-${id}">
    <div class="spec-card-icon">${icon}</div>
    <div class="spec-card-name">${name}</div>
    <div class="spec-card-desc">${desc}</div>
    <div class="spec-card-controls">
      <button type="button" class="spec-card-btn" id="${id}-btn-m" disabled>−</button>
      <div class="spec-card-value" id="${id}-val">0</div>
      <input type="hidden" id="${id}" value="0">
      <button type="button" class="spec-card-btn" id="${id}-btn-p" ${max <= 0 ? 'disabled' : ''}>+</button>
    </div>
  </div>`;
}
function _specDiscCardHtml({ id, icon, name, desc }) {
  return `<div class="spec-card" id="spec-card-${id}">
    <div class="spec-card-icon">${icon}</div>
    <div class="spec-card-name">${name}</div>
    <div class="spec-card-desc">${desc}</div>
    <div class="spec-card-controls">
      <button type="button" class="spec-card-btn" id="${id}-btn-m" disabled>−</button>
      <div class="spec-card-value" id="${id}-val">0</div>
      <input type="hidden" id="${id}" value="0">
      <button type="button" class="spec-card-btn" id="${id}-btn-p">+</button>
    </div>
  </div>`;
}
function _specTogCardHtml({ id, icon, name, desc }) {
  return `<div class="spec-card" id="spec-card-${id}">
    <div class="spec-card-icon">${icon}</div>
    <div class="spec-card-name">${name}</div>
    <div class="spec-card-desc">${desc}</div>
    <input type="hidden" id="${id}" value="0">
    <button type="button" class="spec-toggle-btn" id="${id}-btn">Inaktiv</button>
  </div>`;
}
function _specSyncBar(used, total) {
  const fill = document.getElementById('sp-budget-fill');
  if (!fill) return;
  fill.style.width = (total > 0 ? Math.min(100, Math.round(used / total * 100)) : 0) + '%';
  fill.classList.toggle('over', used > total);
}
function _wireCard(id, min, max, onUpdate) {
  const input = document.getElementById(id);
  const valEl = document.getElementById(`${id}-val`);
  const minBtn = document.getElementById(`${id}-btn-m`);
  const plsBtn = document.getElementById(`${id}-btn-p`);
  const card  = document.getElementById(`spec-card-${id}`);
  function set(v) {
    input.value = v; valEl.textContent = v;
    minBtn.disabled = v <= min; plsBtn.disabled = v >= max;
    card.classList.toggle('maxed', max > 0 && v >= max);
    onUpdate();
  }
  minBtn.addEventListener('click', () => { const c = +input.value||0; if (c > min) set(c - 1); });
  plsBtn.addEventListener('click', () => { const c = +input.value||0; if (c < max) set(c + 1); });
}
function _wireDisc(id, steps, onUpdate) {
  const input = document.getElementById(id);
  const valEl = document.getElementById(`${id}-val`);
  const minBtn = document.getElementById(`${id}-btn-m`);
  const plsBtn = document.getElementById(`${id}-btn-p`);
  const card  = document.getElementById(`spec-card-${id}`);
  function set(v) {
    const i = steps.indexOf(v);
    input.value = v; valEl.textContent = v;
    minBtn.disabled = i <= 0; plsBtn.disabled = i >= steps.length - 1;
    card.classList.toggle('maxed', i >= steps.length - 1);
    onUpdate();
  }
  minBtn.addEventListener('click', () => { const i = steps.indexOf(+input.value||0); if (i > 0) set(steps[i-1]); });
  plsBtn.addEventListener('click', () => { const i = steps.indexOf(+input.value||0); if (i < steps.length-1) set(steps[i+1]); });
}
function _wireTog(id, onUpdate) {
  const input = document.getElementById(id);
  const btn   = document.getElementById(`${id}-btn`);
  const card  = document.getElementById(`spec-card-${id}`);
  btn.addEventListener('click', () => {
    const on = input.value === '1';
    input.value = on ? '0' : '1';
    btn.textContent = on ? 'Inaktiv' : 'Aktiv (4 Pkt)';
    btn.classList.toggle('active', !on);
    card.classList.toggle('maxed', !on);
    onUpdate();
  });
}

function renderUploadSpecialties() {
  const role = (document.getElementById('charRole')?.value || '').toLowerCase();
  const rank = parseInt(document.getElementById('charRank')?.value) || 0;
  const container = document.getElementById('uploadSpecSection');
  if (!container) return;

  if (role === 'medtech') {
    const upd = () => {
      const used = (parseInt(document.getElementById('sp-surgery')?.value)||0)
                 + (parseInt(document.getElementById('sp-pharma')?.value)||0)
                 + (parseInt(document.getElementById('sp-cryo')?.value)||0);
      const b = document.getElementById('sp-budget');
      if (b) { b.textContent = `Punkte vergeben: ${used} / ${rank}`; b.className = `spec-budget${used > rank ? ' over' : ''}`; }
      _specSyncBar(used, rank);
    };
    container.innerHTML = `<div class="field-group">${_specBarHtml(rank)}<div class="spec-cards-grid">`
      + _specCardHtml({ id:'sp-surgery', icon:'🩺', name:'Chirurgie',     desc:'Operative Eingriffe & Stabilisierung', max: rank })
      + _specCardHtml({ id:'sp-pharma',  icon:'💊', name:'Pharmazeutika', desc:'Medikamente & Chemikalien (max 5)',    max: Math.min(5, rank) })
      + _specCardHtml({ id:'sp-cryo',    icon:'❄',  name:'Cryosystem',   desc:'Kryogene Konservierung (max 5)',       max: Math.min(5, rank) })
      + `</div></div>`;
    _wireCard('sp-surgery', 0, rank, upd);
    _wireCard('sp-pharma',  0, Math.min(5, rank), upd);
    _wireCard('sp-cryo',    0, Math.min(5, rank), upd);
    upd();
  } else if (role === 'tech') {
    const upd = () => {
      const used = ['sp-field','sp-upgrade','sp-fab','sp-inv']
        .reduce((a, id) => a + (parseInt(document.getElementById(id)?.value)||0), 0);
      const total = rank * 2;
      const b = document.getElementById('sp-budget');
      if (b) { b.textContent = `Punkte vergeben: ${used} / ${total}`; b.className = `spec-budget${used > total ? ' over' : ''}`; }
      _specSyncBar(used, total);
    };
    container.innerHTML = `<div class="field-group">${_specBarHtml(rank * 2)}<div class="spec-cards-grid">`
      + _specCardHtml({ id:'sp-field',   icon:'🔧', name:'Field Expertise', desc:'Reparaturen & Feldarbeit', max: rank })
      + _specCardHtml({ id:'sp-upgrade', icon:'⚙',  name:'Upgrade',        desc:'Aufrüstung & Modifikationen', max: rank })
      + _specCardHtml({ id:'sp-fab',     icon:'🏗',  name:'Fabrication',    desc:'Herstellung & Fertigung',  max: rank })
      + _specCardHtml({ id:'sp-inv',     icon:'💡', name:'Invention',       desc:'Erfindungen & Prototypen', max: rank })
      + `</div></div>`;
    _wireCard('sp-field',   0, rank, upd);
    _wireCard('sp-upgrade', 0, rank, upd);
    _wireCard('sp-fab',     0, rank, upd);
    _wireCard('sp-inv',     0, rank, upd);
    upd();
  } else if (role === 'solo') {
    const upd = () => {
      const used = (parseInt(document.getElementById('sp-dd')?.value)||0)
                 + (document.getElementById('sp-fumble')?.value === '1' ? 4 : 0)
                 + (parseInt(document.getElementById('sp-ir')?.value)||0)
                 + (parseInt(document.getElementById('sp-pa')?.value)||0)
                 + (parseInt(document.getElementById('sp-sw')?.value)||0)
                 + (parseInt(document.getElementById('sp-td')?.value)||0);
      const b = document.getElementById('sp-budget');
      if (b) { b.textContent = `Punkte vergeben: ${used} / ${rank}`; b.className = `spec-budget${used > rank ? ' over' : ''}`; }
      _specSyncBar(used, rank);
    };
    container.innerHTML = `<div class="field-group">${_specBarHtml(rank)}<div class="spec-cards-grid">`
      + _specDiscCardHtml({ id:'sp-dd',     icon:'🛡', name:'Damage Deflection', desc:'Passiver SP-Bonus (Stufen: 2/4/6/8/10)' })
      + _specTogCardHtml( { id:'sp-fumble', icon:'🎲', name:'Fumble Recovery',   desc:'Patzer abwenden — 4 Punkte' })
      + _specCardHtml(    { id:'sp-ir',     icon:'⚡', name:'Initiative Reaction',desc:'Bonus auf Initiative',  max: rank })
      + _specDiscCardHtml({ id:'sp-pa',     icon:'🎯', name:'Precision Attack',  desc:'Zielgenauigkeit (Stufen: 3/6/9)' })
      + _specCardHtml(    { id:'sp-sw',     icon:'👁', name:'Spot Weakness',     desc:'Schwachstellen erkennen', max: rank })
      + _specCardHtml(    { id:'sp-td',     icon:'🕵', name:'Threat Detection',  desc:'Bedrohungen erkennen',   max: rank })
      + `</div></div>`;
    _wireDisc('sp-dd', [0,2,4,6,8,10], upd);
    _wireTog('sp-fumble', upd);
    _wireCard('sp-ir', 0, rank, upd);
    _wireDisc('sp-pa', [0,3,6,9], upd);
    _wireCard('sp-sw', 0, rank, upd);
    _wireCard('sp-td', 0, rank, upd);
    upd();
  } else {
    container.innerHTML = '';
  }
}

// ── Role UI ───────────────────────────────────────────────────
function handleRoleChange() {
  renderUploadSpecialties();
}
document.getElementById('charRole')?.addEventListener('change', handleRoleChange);
document.getElementById('charRank')?.addEventListener('input', renderUploadSpecialties);

// ── File input via label[for="pdfInput"] ─────────────────────
// label click → browser opens dialog → change fires
pdfInput.addEventListener('change', () => {
  const file = pdfInput.files[0];
  if (file) handlePDF(file);
});

// ── Drag & drop ───────────────────────────────────────────────
// Document-level: prevent Safari from navigating to dropped file
['dragenter','dragover','drop'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), false)
);

dropZone.addEventListener('dragenter', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragover',  e => { e.preventDefault(); });
dropZone.addEventListener('dragleave', e => {
  if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file?.type === 'application/pdf') handlePDF(file);
  else showStatus('Bitte eine PDF-Datei (.pdf) auswählen.', 'error');
});

// ── Manual portrait ───────────────────────────────────────────
manualImg.addEventListener('change', () => {
  const file = manualImg.files[0];
  if (!file) return;
  manualImgBlob = file;
  manualImgName.textContent = file.name;
  showPreview(file);
  updateSubmitState();
});

// ── PDF processing ────────────────────────────────────────────
async function handlePDF(file) {
  pdfFile = file;
  pdfName.textContent = file.name;
  pdfName.hidden = false;
  parsedResult = null;
  hideStatus();
  setProgress(5, 'Lese PDF…');
  progressWrap.hidden = false;
  submitBtn.disabled = true;

  try {
    const buf = await file.arrayBuffer();
    setProgress(30, 'Parse AcroForm-Felder…');

    parsedResult = await parsePDF(buf);
    setProgress(80, 'Felder gemappt');

    // Log raw fields to console for field-name debugging
    console.log('[pdf-parser] parsed character:', parsedResult.character);
    console.log('[pdf-parser] imageBlob:', parsedResult.imageBlob);

    // Pre-fill editable name fields
    if (parsedResult.character.name && parsedResult.character.name !== 'Unnamed') {
      charName.value = parsedResult.character.name;
    }
    if (!playerName.value && parsedResult.character.handle) {
      playerName.value = parsedResult.character.handle;
    }

    // Show extracted image or hint
    if (parsedResult.imageBlob) {
      showPreview(parsedResult.imageBlob);
      imgHint.textContent = '✓ Portrait aus PDF extrahiert';
      manualImgBlob = null;
    } else {
      imgHint.textContent = 'Kein Portrait im PDF — hier manuell hochladen:';
    }

    setProgress(100, 'Bereit');
    showStatus(`PDF gelesen: ${parsedResult.character.name || '(kein Handle)'}`, 'success');
    // Show role selection
    document.getElementById('roleSection').style.display = '';
    document.getElementById('rankSection').style.display = '';
    if (parsedResult.character.role) {
      const sel = document.getElementById('charRole');
      // Try exact match or capitalized match
      const roleVal = parsedResult.character.role;
      const opt = [...sel.options].find(o => o.value.toLowerCase() === roleVal.toLowerCase());
      if (opt) sel.value = opt.value;
      handleRoleChange();
    }
    updateSubmitState();
  } catch (err) {
    console.error(err);
    progressWrap.hidden = true;
    showStatus(`Fehler beim Parsen: ${err.message}`, 'error');
  }
}

// ── Submit ────────────────────────────────────────────────────
submitBtn.addEventListener('click', async () => {
  if (!parsedResult) return;
  submitBtn.disabled = true;
  hideStatus();

  const nameVal = charName.value.trim();
  if (!nameVal) {
    showStatus('Bitte einen Character-Namen eingeben.', 'error');
    submitBtn.disabled = false;
    return;
  }

  try {
    const roleVal  = document.getElementById('charRole')?.value || parsedResult.character.role || '';
    const rankVal  = parseInt(document.getElementById('charRank')?.value) || 4;
    const roleKey  = roleVal.toLowerCase();
    let roleAbilityData = {};
    const _spInt = id => Math.max(0, parseInt(document.getElementById(id)?.value)||0);
    if (roleKey === 'medtech') {
      roleAbilityData = { specialtyPoints: {
        surgery:              _spInt('sp-surgery'),
        pharmaceuticals:      Math.min(5, _spInt('sp-pharma')),
        cryosystem_operation: Math.min(5, _spInt('sp-cryo')),
      }};
    } else if (roleKey === 'tech') {
      roleAbilityData = { specialtyRanks: {
        field:       _spInt('sp-field'),
        upgrade:     _spInt('sp-upgrade'),
        fabrication: _spInt('sp-fab'),
        invention:   _spInt('sp-inv'),
      }};
    } else if (roleKey === 'solo') {
      roleAbilityData = { combatAwareness: {
        damage_deflection:    _spInt('sp-dd'),
        fumble_recovery:      document.getElementById('sp-fumble')?.value === '1',
        initiative_reaction:  _spInt('sp-ir'),
        precision_attack:     _spInt('sp-pa'),
        spot_weakness:        _spInt('sp-sw'),
        threat_detection:     _spInt('sp-td'),
      }};
    } else if (roleKey === 'exec') {
      roleAbilityData = { teamMembers: [] };
    } else if (roleKey === 'nomad') {
      roleAbilityData = { vehiclePool: [], activeVehicle: null };
    } else if (roleKey === 'rockerboy') {
      roleAbilityData = { fanRelations: '' };
    }

    const character = {
      ...parsedResult.character,
      name:              nameVal,
      handle:            nameVal,
      player_name:       playerName.value.trim() || nameVal,
      role:              roleVal || parsedResult.character.role || '',
      role_ability_rank: rankVal,
      role_ability_data: roleAbilityData,
    };

    setProgress(10, 'Erstelle Charakterprofil…');
    progressWrap.hidden = false;

    // Insert without image_url first to get the id
    const saved = await saveCharacter(character);

    // Upload portrait
    const blob = manualImgBlob ?? parsedResult.imageBlob;
    if (blob) {
      setProgress(50, 'Lade Portrait hoch…');
      const imageUrl = await uploadPortrait(blob, saved.id);
      await patchCharacter(saved.id, { image_url: imageUrl });
    }

    setProgress(100, 'Gespeichert!');
    showStatus(`Charakter "${saved.name}" gespeichert — Weiterleitung…`, 'success');

    setTimeout(() => {
      window.location.href = `player.html?id=${saved.id}`;
    }, 1200);
  } catch (err) {
    console.error(err);
    showStatus(`Fehler beim Speichern: ${err.message}`, 'error');
    submitBtn.disabled = false;
  }
});

// ── Helpers ───────────────────────────────────────────────────
function setProgress(pct, label) {
  progressFill.style.width = pct + '%';
  if (pct >= 100) progressFill.classList.add('done');
  else progressFill.classList.remove('done');
  progressLabel.textContent = label;
  progressPct.textContent   = pct + '%';
}

function showStatus(msg, type = 'info') {
  statusMsg.textContent = msg;
  statusMsg.className   = `status-msg visible ${type}`;
}
function hideStatus() {
  statusMsg.className = 'status-msg';
}

function showPreview(source) {
  const url = source instanceof Blob ? URL.createObjectURL(source) : URL.createObjectURL(source);
  imgPreview.src    = url;
  imgPreview.hidden = false;
}

function updateSubmitState() {
  submitBtn.disabled = !parsedResult;
}
</script>
