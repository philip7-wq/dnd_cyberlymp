<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tactical Map — LZRV Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/map.css">
</head>
<body class="map-page">

<!-- Context Menu -->
<div id="ctxMenu" class="map-ctx-menu" style="display:none">
  <div class="map-ctx-item" id="ctxHp">❤ HP setzen</div>
  <div class="map-ctx-item" id="ctxCondition">⚡ Condition</div>
  <div class="map-ctx-sep"></div>
  <div class="map-ctx-item danger" id="ctxRemove">✕ Entfernen</div>
</div>

<!-- Hover Tooltip -->
<div id="mapTooltip" class="map-tooltip" style="display:none">
  <div class="map-tooltip-name" id="ttName"></div>
  <div class="map-tooltip-hp" id="ttHp"></div>
  <div class="map-tooltip-cond" id="ttCond"></div>
</div>

<!-- Token Modal -->
<div id="tokenModal" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center">
  <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:min(500px,96vw);max-height:85vh;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border);font-family:Audiowide,sans-serif;font-size:.75rem;color:var(--cyan);letter-spacing:.1em">
      TOKEN HINZUFÜGEN
      <button id="tokenModalClose" style="background:none;border:none;color:var(--text-muted);font-size:1rem;cursor:pointer">✕</button>
    </div>
    <div style="padding:.75rem 1rem;display:flex;flex-direction:column;gap:.65rem;overflow-y:auto">
      <div class="token-picker-tabs">
        <button class="token-picker-tab active" data-tab="chars">Charaktere</button>
        <button class="token-picker-tab" data-tab="npcs">NPCs</button>
        <button class="token-picker-tab" data-tab="custom">Custom</button>
      </div>
      <div id="tokenPickerChars" class="token-picker-grid"></div>
      <div id="tokenPickerNpcs"  class="token-picker-grid" style="display:none"></div>
      <div id="tokenPickerCustom" class="custom-token-form" style="display:none">
        <input id="customLabel" class="ctrl-input" placeholder="Label (1-2 Zeichen / Emoji)" maxlength="3">
        <input id="customName"  class="ctrl-input" placeholder="Name">
        <div class="custom-token-color-row">
          Farbe <input type="color" id="customColor" value="#FF8C00">
        </div>
        <button id="customAddBtn" class="ctrl-btn" style="color:var(--cyan)">+ Hinzufügen</button>
      </div>
    </div>
  </div>
</div>

<!-- Nav -->
<nav class="nav" id="mapNav">
  <img src="assets/img/logo.png" alt="LZRV Hub" class="nav-logo-img">
  <span id="mapPageTitle" style="font-family:var(--font-display);font-size:.72rem;color:var(--red);margin-left:.75rem;letter-spacing:.12em">TACTICAL MAP</span>
  <span id="mapNameDisplay" style="font-size:.72rem;color:var(--text-muted);margin-left:.75rem"></span>
  <a id="mapBackBtn" href="index.html" class="btn btn-ghost" style="font-size:.75rem;margin-left:auto">← Zurück</a>
</nav>

<!-- Main Layout -->
<div class="map-layout" id="mapLayout">

  <!-- DM Toolbar (left) -->
  <div class="map-toolbar" id="dmToolbar" style="display:none">
    <button class="map-tool-btn active" data-tool="select" title="Auswählen / Bewegen (V)">🖱</button>
    <span class="map-tool-label">Select</span>
    <button class="map-tool-btn" data-tool="measure" title="Messen (M)">📏</button>
    <span class="map-tool-label">Messen</span>
    <button class="map-tool-btn" data-tool="aoe" title="AoE Kreis (A)">⭕</button>
    <span class="map-tool-label">AoE</span>
    <div class="map-tool-sep"></div>
    <button class="map-tool-btn" data-tool="pen" title="Freihand (P)">✏️</button>
    <span class="map-tool-label">Pen</span>
    <button class="map-tool-btn" data-tool="rect" title="Rechteck (R)">▭</button>
    <span class="map-tool-label">Rect</span>
    <button class="map-tool-btn" data-tool="circle" title="Kreis (C)">○</button>
    <span class="map-tool-label">Circle</span>
    <div class="map-tool-sep"></div>
    <button class="map-tool-btn" data-tool="delete" title="Löschen (Del)">🗑</button>
    <span class="map-tool-label">Delete</span>
    <div class="map-tool-sep"></div>
    <div class="map-draw-config">
      <input type="color" id="toolColor" value="#00E5FF" title="Farbe">
      <input type="range" id="toolSize" min="1" max="12" value="2" title="Stärke">
    </div>
  </div>

  <!-- Canvas -->
  <div class="map-canvas-wrap tool-select" id="canvasWrap">
    <div class="map-loader" id="mapLoader">LADE KARTE…</div>
    <canvas id="mapCanvas"></canvas>
  </div>

  <!-- DM Controls (right) -->
  <div class="map-controls" id="mapControls" style="display:none">

    <div class="map-ctrl-section">
      <div class="map-ctrl-head">Tokens</div>
      <button id="addTokenBtn" class="ctrl-btn">+ Token hinzufügen</button>
    </div>

    <div class="map-ctrl-section">
      <div class="map-ctrl-head">Zeichnen</div>
      <button id="undoDrawBtn" class="ctrl-btn">↩ Undo</button>
      <button id="clearDrawBtn" class="ctrl-btn" style="color:var(--red)">🧹 Alles löschen</button>
    </div>

    <div class="map-ctrl-section">
      <div class="map-ctrl-head">AoE Einstellungen</div>
      <div class="aoe-config-row">
        <input type="number" id="aoeRadius" value="5" min="1" max="99" title="Radius in Metern">
        <span style="font-size:.7rem;color:var(--text-muted)">m</span>
        <input type="color" id="aoeColor" value="#FF2D2D" title="Farbe">
      </div>
      <input type="text" id="aoeLabel" class="ctrl-input" placeholder="Label (optional)" style="font-size:.75rem" maxlength="24">
    </div>

    <div class="map-ctrl-section">
      <div class="map-ctrl-head">Grid</div>
      <label>
        <input type="checkbox" id="gridToggle" checked>
        Grid anzeigen
      </label>
      <div class="map-ctrl-row">
        <input type="range" id="gridSizeSlider" min="25" max="100" value="50" style="flex:1">
        <span class="map-ctrl-size-label" id="gridSizeLabel">50px</span>
      </div>
    </div>

    <div class="map-ctrl-section">
      <div class="map-ctrl-head">Hintergrund</div>
      <button id="bgUploadBtn" class="ctrl-btn">🖼 Bild hochladen</button>
      <button id="bgClearBtn" class="ctrl-btn" style="color:var(--text-muted)">✕ Hintergrund entfernen</button>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none">
    </div>

    <div class="map-ctrl-section">
      <div class="map-ctrl-head">Karte</div>
      <input id="mapNameInput" class="ctrl-input" value="Aktuelle Karte" maxlength="60" style="font-size:.8rem">
      <button id="saveMapNameBtn" class="ctrl-btn" style="color:var(--cyan)">💾 Name speichern</button>
    </div>

  </div>
</div>

<!-- Status Bar (DM) -->
<div class="map-status-bar" id="mapStatusBar" style="display:none">
  <span id="statusTool">Werkzeug: Select</span>
  <span id="statusCoords">—</span>
  <span id="statusZoom">100%</span>
  <span id="statusTokenCount">0 Tokens</span>
</div>

<script type="module">
import {
  getCharacters, getCharacter, getNpcs, getActiveCombat,
  getLatestMap, getMap, saveMap, subscribeMaps, uploadMapBackground,
  subscribeCombat,
} from './assets/js/supabase.js';

// ── Auth / Mode ───────────────────────────────────────────────
const urlParams = new URLSearchParams(location.search);
const CHAR_ID   = urlParams.get('id');
const MAP_ID    = urlParams.get('map');
const IS_DM     = sessionStorage.getItem('dm_auth') === '1';

if (!IS_DM && !CHAR_ID) location.replace('index.html');

// ── Canvas setup ──────────────────────────────────────────────
const canvas   = document.getElementById('mapCanvas');
const ctx      = canvas.getContext('2d');
const wrap     = document.getElementById('canvasWrap');

function resizeCanvas() {
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  redraw();
}

// ── State ─────────────────────────────────────────────────────
const S = {
  mapId: null, mapName: 'Neue Karte',
  bgImage: null, bgUrl: null,
  gridSize: 50, gridEnabled: true,
  tokens:   [],
  drawings: [],

  scale: 1, ox: 0, oy: 0,

  tool: 'select',
  dragging: null,
  isPanning: false, panStart: null, panOrigin: null,
  spaceDown: false,

  drawPath:   null,
  shapeStart: null, shapeCurrent: null,

  measureStart: null, measureEnd: null, measureTimer: null,

  moveRangeToken: null,
  hoverToken: null,
  ctxToken: null,

  aoeConfig: { radius: 5, color: '#FF2D2D', label: '' },
  penColor: '#00E5FF', penWidth: 2,

  combatSession: null,
  char: null,
  chars: [],
  npcs: [],

  localDragging: false,
  dirty: false,
  saveTimer: null,
  animFrame: null,
  lastPulse: 0,
};

// ── Coord helpers ─────────────────────────────────────────────
function sw(sx, sy) { return { x:(sx - S.ox)/S.scale, y:(sy - S.oy)/S.scale }; }
function snapGrid(v) { return S.gridSize > 0 ? Math.round(v / S.gridSize) * S.gridSize : v; }
function hitToken(wx, wy) {
  const r = S.gridSize * 0.5;
  for (let i = S.tokens.length - 1; i >= 0; i--) {
    const t = S.tokens[i];
    if (Math.hypot(wx - t.x, wy - t.y) < r) return t;
  }
  return null;
}
function hitDrawing(wx, wy) {
  for (let i = S.drawings.length - 1; i >= 0; i--) {
    const d = S.drawings[i];
    if (d.type === 'pen') {
      for (const p of d.points) {
        if (Math.hypot(wx-p.x, wy-p.y) < (d.lineWidth||2) + 6) return i;
      }
    } else if (d.type === 'rect') {
      if (wx >= d.x && wx <= d.x+d.w && wy >= d.y && wy <= d.y+d.h) return i;
    } else if (d.type === 'circle' || d.type === 'aoe') {
      if (Math.abs(Math.hypot(wx-d.cx, wy-d.cy) - d.r) < 8) return i;
    }
  }
  return -1;
}

// ── Image loading ─────────────────────────────────────────────
function loadTokenImage(token) {
  if (!token.imageUrl || token._img) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { token._img = img; markDirty(); };
  img.onerror = () => { token._img = null; };
  img.src = token.imageUrl;
  token._img = null; // loading sentinel
}

function loadBackground(url) {
  if (!url) { S.bgImage = null; S.bgUrl = null; markDirty(); return; }
  if (url === S.bgUrl && S.bgImage) return;
  S.bgUrl = url;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { S.bgImage = img; markDirty(); };
  img.src = url;
}

// ── Merge helpers ─────────────────────────────────────────────
function mergeTokens(incoming) {
  if (!Array.isArray(incoming)) return;
  const old = new Map(S.tokens.map(t => [t.id, t]));
  S.tokens = incoming.map(t => {
    const prev = old.get(t.id);
    const merged = { ...t, _img: prev?._img ?? undefined };
    if (!merged._img && t.imageUrl) loadTokenImage(merged);
    return merged;
  });
}

function applyMapData(m) {
  S.mapId      = m.id;
  S.mapName    = m.name || 'Karte';
  S.gridSize   = m.grid_size   ?? 50;
  S.gridEnabled = m.grid_enabled ?? true;
  S.drawings   = m.drawings    ?? [];
  mergeTokens(m.tokens ?? []);
  if (m.background_url !== S.bgUrl) loadBackground(m.background_url || null);
  document.getElementById('mapNameDisplay').textContent = S.mapName;
  if (IS_DM) {
    document.getElementById('mapNameInput').value = S.mapName;
    document.getElementById('gridToggle').checked = S.gridEnabled;
    document.getElementById('gridSizeSlider').value = S.gridSize;
    document.getElementById('gridSizeLabel').textContent = S.gridSize + 'px';
  }
  markDirty();
}

function stripImages(t) {
  const { _img, ...rest } = t; return rest;
}

// ── Save (debounced) ──────────────────────────────────────────
function scheduleSave(patch) {
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(async () => {
    if (!S.mapId) return;
    try { await saveMap({ id: S.mapId, ...patch }); } catch(e) { console.warn('saveMap:', e); }
  }, 120);
}
function saveTokens()   { scheduleSave({ tokens:   S.tokens.map(stripImages) }); }
function saveDrawings() { scheduleSave({ drawings: S.drawings }); }
function saveGrid()     { scheduleSave({ grid_size: S.gridSize, grid_enabled: S.gridEnabled }); }

// ── Render ────────────────────────────────────────────────────
function markDirty() { S.dirty = true; }

function startRenderLoop() {
  function loop() {
    // Always redraw if combat active (for pulse animation)
    if (S.combatSession?.is_active) S.dirty = true;
    if (S.dirty) { S.dirty = false; redraw(); }
    S.animFrame = requestAnimationFrame(loop);
  }
  S.animFrame = requestAnimationFrame(loop);
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(S.ox, S.oy);
  ctx.scale(S.scale, S.scale);

  drawBackground();
  drawGrid();
  drawDrawings();
  drawActiveShape();
  drawActivePen();
  drawMoveRange();
  drawTokens();
  drawMeasureLine();

  ctx.restore();
  updateStatusBar();
}

function drawBackground() {
  if (S.bgImage) {
    ctx.drawImage(S.bgImage, 0, 0);
  } else {
    ctx.fillStyle = '#07070d';
    const w = canvas.width / S.scale, h = canvas.height / S.scale;
    const ox = -S.ox / S.scale, oy = -S.oy / S.scale;
    ctx.fillRect(ox, oy, w, h);
  }
}

function drawGrid() {
  if (!S.gridEnabled || S.gridSize < 5) return;
  const gs = S.gridSize;
  const vl = -S.ox / S.scale, vt = -S.oy / S.scale;
  const vr = vl + canvas.width / S.scale, vb = vt + canvas.height / S.scale;
  const startX = Math.floor(vl / gs) * gs, startY = Math.floor(vt / gs) * gs;

  ctx.strokeStyle = 'rgba(0,229,255,0.10)';
  ctx.lineWidth   = 0.5 / S.scale;
  ctx.beginPath();
  for (let x = startX; x <= vr; x += gs) { ctx.moveTo(x, vt); ctx.lineTo(x, vb); }
  for (let y = startY; y <= vb; y += gs) { ctx.moveTo(vl, y); ctx.lineTo(vr, y); }
  ctx.stroke();
}

function drawDrawings() {
  for (const d of S.drawings) {
    ctx.save();
    ctx.strokeStyle = d.color || '#00E5FF';
    ctx.fillStyle   = d.color || '#00E5FF';
    ctx.lineWidth   = (d.lineWidth || 2) / S.scale;
    ctx.lineCap     = 'round'; ctx.lineJoin = 'round';

    if (d.type === 'pen') {
      if (!d.points?.length) { ctx.restore(); continue; }
      ctx.beginPath();
      ctx.moveTo(d.points[0].x, d.points[0].y);
      for (let i = 1; i < d.points.length; i++) ctx.lineTo(d.points[i].x, d.points[i].y);
      ctx.stroke();

    } else if (d.type === 'rect') {
      if (d.filled) { ctx.globalAlpha = 0.25; ctx.fillRect(d.x, d.y, d.w, d.h); ctx.globalAlpha = 1; }
      ctx.strokeRect(d.x, d.y, d.w, d.h);

    } else if (d.type === 'circle') {
      ctx.beginPath(); ctx.arc(d.cx, d.cy, d.r, 0, Math.PI*2);
      if (d.filled) { ctx.globalAlpha = 0.2; ctx.fill(); ctx.globalAlpha = 1; }
      ctx.stroke();

    } else if (d.type === 'aoe') {
      // Filled translucent circle
      ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.arc(d.cx, d.cy, d.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1.5 / S.scale;
      ctx.beginPath(); ctx.arc(d.cx, d.cy, d.r, 0, Math.PI*2); ctx.stroke();
      if (d.label) {
        ctx.fillStyle = d.color || '#FF2D2D';
        ctx.font = `bold ${11/S.scale}px Audiowide`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(d.label, d.cx, d.cy);
      }
      // Radius label
      ctx.fillStyle = d.color || '#FF2D2D';
      ctx.font = `${10/S.scale}px Inter`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      const mLabel = `${(d.r / S.gridSize).toFixed(1)} m`;
      ctx.fillText(mLabel, d.cx, d.cy - d.r - 3/S.scale);
    }
    ctx.restore();
  }
}

function drawActivePen() {
  if (!S.drawPath || S.drawPath.length < 2) return;
  ctx.save();
  ctx.strokeStyle = S.penColor; ctx.lineWidth = S.penWidth / S.scale;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(S.drawPath[0].x, S.drawPath[0].y);
  for (let i = 1; i < S.drawPath.length; i++) ctx.lineTo(S.drawPath[i].x, S.drawPath[i].y);
  ctx.stroke(); ctx.restore();
}

function drawActiveShape() {
  if (!S.shapeStart || !S.shapeCurrent) return;
  ctx.save();
  const color = document.getElementById('toolColor')?.value || '#FF2D2D';
  ctx.strokeStyle = color; ctx.lineWidth = 1.5 / S.scale;
  ctx.setLineDash([4/S.scale, 4/S.scale]);
  const {x:x1,y:y1} = S.shapeStart, {x:x2,y:y2} = S.shapeCurrent;
  if (S.tool === 'rect') {
    ctx.strokeRect(x1, y1, x2-x1, y2-y1);
  } else if (S.tool === 'circle') {
    const r = Math.hypot(x2-x1, y2-y1);
    ctx.beginPath(); ctx.arc(x1, y1, r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.restore();
}

function drawMoveRange() {
  if (!S.moveRangeToken) return;
  const t = S.moveRangeToken;
  const moveM = S.char?.stats?.MOVE ?? (IS_DM ? 6 : 4);
  const r = moveM * S.gridSize;
  ctx.save();
  ctx.strokeStyle = 'rgba(0,229,255,.5)';
  ctx.fillStyle   = 'rgba(0,229,255,.05)';
  ctx.lineWidth   = 1.5 / S.scale;
  ctx.setLineDash([5/S.scale, 5/S.scale]);
  ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(0,229,255,.7)'; ctx.font = `${10/S.scale}px Audiowide`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(`MOVE ${moveM}m`, t.x, t.y + r + 4/S.scale);
  ctx.restore();
}

function drawTokens() {
  const now = Date.now();
  const activeCombatant = S.combatSession?.is_active
    ? S.combatSession.combatants?.[S.combatSession.current_turn_index]
    : null;

  for (const token of S.tokens) {
    const r   = S.gridSize * 0.44;
    const cx  = token.x, cy = token.y;
    const isChar = token.type === 'char';
    const isNpc  = token.type === 'npc';
    const borderColor = isChar ? '#00E5FF' : isNpc ? '#FF2D2D' : (token.color || '#FF8C00');

    // Active combatant glow
    const isActive = activeCombatant && (
      (isChar && token.charId === activeCombatant.id) ||
      (isNpc  && token.npcId  === activeCombatant.npcDbId)
    );
    if (isActive) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 280);
      ctx.save();
      ctx.shadowColor = activeCombatant.isNpc ? '#FF2D2D' : '#00FF88';
      ctx.shadowBlur  = (18 * pulse) / S.scale;
      ctx.beginPath(); ctx.arc(cx, cy, r + 3/S.scale, 0, Math.PI*2);
      ctx.strokeStyle = activeCombatant.isNpc ? '#FF2D2D' : '#00FF88';
      ctx.lineWidth   = 2 / S.scale; ctx.stroke();
      ctx.restore();
    }

    // Background circle
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = isChar ? 'rgba(0,229,255,.1)' : isNpc ? 'rgba(255,45,45,.12)' : hexToRgba(token.color||'#FF8C00', .12);
    ctx.fill();

    // Portrait clip
    if (token._img) {
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(token._img, cx-r, cy-r, r*2, r*2);
      ctx.restore();
    } else {
      // Fallback label
      const lbl = token.label || (token.name?.[0] || '?');
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${r * 0.9}px Audiowide`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(lbl, cx, cy);
    }

    // Border
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = borderColor;
    ctx.lineWidth   = 2 / S.scale; ctx.stroke();
    ctx.restore();

    // Name label
    ctx.fillStyle = '#e0e0e8';
    ctx.font = `${11/S.scale}px Inter`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(token.name || '', cx, cy + r + 2/S.scale);

    // HP bar (chars always, NPCs only in DM mode)
    if (token.maxHp != null && (isChar || IS_DM)) {
      const bw = r * 1.8, bh = 3.5 / S.scale;
      const bx = cx - bw/2, by = cy + r + (14/S.scale);
      const pct = Math.max(0, Math.min(1, (token.hp ?? token.maxHp) / token.maxHp));
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx - .5/S.scale, by - .5/S.scale, bw + 1/S.scale, bh + 1/S.scale);
      ctx.fillStyle = '#222'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = pct > 0.5 ? '#00E5FF' : pct > 0.25 ? '#FFD700' : '#FF2D2D';
      ctx.fillRect(bx, by, bw * pct, bh);
    }
  }
}

function drawMeasureLine() {
  if (!S.measureStart) return;
  const end = S.measureEnd || S.measureStart;
  const {x:x1,y:y1} = S.measureStart, {x:x2,y:y2} = end;
  const dist = Math.hypot(x2-x1, y2-y1) / S.gridSize;

  ctx.save();
  ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2 / S.scale;
  ctx.setLineDash([5/S.scale, 4/S.scale]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]);

  // End dots
  [{ x:x1,y:y1 }, { x:x2,y:y2 }].forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 3/S.scale, 0, Math.PI*2);
    ctx.fillStyle = '#FFD700'; ctx.fill();
  });

  // Label
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const label = `${dist.toFixed(1)} m`;
  ctx.font = `bold ${12/S.scale}px Audiowide`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  const tw = ctx.measureText(label).width;
  ctx.fillRect(mx - tw/2 - 3/S.scale, my - 16/S.scale, tw + 6/S.scale, 14/S.scale);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(label, mx, my - 4/S.scale);
  ctx.restore();
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Mouse Events ──────────────────────────────────────────────
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { sx: e.clientX - rect.left, sy: e.clientY - rect.top };
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  const { sx, sy } = getCanvasPos(e);
  const wp = sw(sx, sy);

  // Middle-click or space+left = pan
  if (e.button === 1 || (e.button === 0 && S.spaceDown)) {
    S.isPanning = true;
    S.panStart  = { sx, sy };
    S.panOrigin = { ox: S.ox, oy: S.oy };
    wrap.classList.add('panning'); return;
  }
  if (e.button !== 0) return;

  if (S.tool === 'select') {
    const hit = hitToken(wp.x, wp.y);
    if (hit) {
      const canDrag = IS_DM || hit.charId === CHAR_ID;
      if (canDrag) {
        S.dragging = { token: hit, wx0: wp.x, wy0: wp.y, tx0: hit.x, ty0: hit.y };
        S.localDragging = true;
        S.moveRangeToken = null;
      } else {
        // Show move range for own token click
        S.moveRangeToken = (hit.charId === CHAR_ID) ? hit : null;
      }
      // Click selects token (show move range for DM too)
      if (IS_DM) S.moveRangeToken = hit;
    } else {
      S.moveRangeToken = null;
    }

  } else if (S.tool === 'measure') {
    S.measureStart = wp; S.measureEnd = null;
    clearTimeout(S.measureTimer);

  } else if (S.tool === 'pen') {
    S.drawPath = [wp];

  } else if (S.tool === 'rect' || S.tool === 'circle') {
    S.shapeStart = wp; S.shapeCurrent = wp;

  } else if (S.tool === 'aoe') {
    placeAoe(wp);

  } else if (S.tool === 'delete') {
    const hitIdx = hitDrawing(wp.x, wp.y);
    if (hitIdx >= 0) { S.drawings.splice(hitIdx, 1); saveDrawings(); }
    const hitTok = hitToken(wp.x, wp.y);
    if (IS_DM && hitTok) { S.tokens = S.tokens.filter(t => t !== hitTok); saveTokens(); }
  }
  markDirty();
});

canvas.addEventListener('mousemove', e => {
  const { sx, sy } = getCanvasPos(e);
  const wp = sw(sx, sy);

  if (S.isPanning) {
    S.ox = S.panOrigin.ox + (sx - S.panStart.sx);
    S.oy = S.panOrigin.oy + (sy - S.panStart.sy);
    markDirty(); return;
  }

  if (S.dragging) {
    const t = S.dragging.token;
    t.x = snapGrid(S.dragging.tx0 + (wp.x - S.dragging.wx0));
    t.y = snapGrid(S.dragging.ty0 + (wp.y - S.dragging.wy0));
    markDirty(); return;
  }

  if (S.tool === 'measure' && S.measureStart) {
    S.measureEnd = wp; markDirty(); return;
  }

  if (S.tool === 'pen' && S.drawPath) {
    S.drawPath.push(wp); markDirty(); return;
  }

  if ((S.tool === 'rect' || S.tool === 'circle') && S.shapeStart) {
    S.shapeCurrent = wp; markDirty(); return;
  }

  // Hover detection
  const h = hitToken(wp.x, wp.y);
  if (h !== S.hoverToken) { S.hoverToken = h; markDirty(); }
  showTooltip(h, e.clientX, e.clientY);

  // Cursor update for status bar
  document.getElementById('statusCoords').textContent =
    `${Math.round(wp.x / S.gridSize * 10)/10}m, ${Math.round(wp.y / S.gridSize * 10)/10}m`;
});

canvas.addEventListener('mouseup', e => {
  if (S.isPanning) {
    S.isPanning = false;
    wrap.classList.remove('panning'); return;
  }

  if (S.dragging) {
    S.localDragging = false;
    S.dragging = null;
    saveTokens(); return;
  }

  const { sx, sy } = getCanvasPos(e);
  const wp = sw(sx, sy);

  if (S.tool === 'measure' && S.measureStart) {
    S.measureEnd = wp;
    clearTimeout(S.measureTimer);
    S.measureTimer = setTimeout(() => { S.measureStart = null; S.measureEnd = null; markDirty(); }, 5000);
    markDirty(); return;
  }

  if (S.tool === 'pen' && S.drawPath && S.drawPath.length > 1) {
    const color = document.getElementById('toolColor')?.value || S.penColor;
    const size  = parseInt(document.getElementById('toolSize')?.value) || S.penWidth;
    S.drawings.push({ id: uid(), type: 'pen', color, lineWidth: size, points: S.drawPath });
    S.drawPath = null; saveDrawings(); return;
  }

  if ((S.tool === 'rect' || S.tool === 'circle') && S.shapeStart) {
    const color = document.getElementById('toolColor')?.value || '#FF2D2D';
    const {x:x1,y:y1} = S.shapeStart, {x:x2,y:y2} = wp;
    if (S.tool === 'rect') {
      const x = Math.min(x1,x2), y = Math.min(y1,y2), w = Math.abs(x2-x1), h = Math.abs(y2-y1);
      if (w > 2 && h > 2) { S.drawings.push({ id:uid(), type:'rect', color, x, y, w, h, lineWidth:2, filled:false }); saveDrawings(); }
    } else {
      const r = Math.hypot(x2-x1, y2-y1);
      if (r > 2) { S.drawings.push({ id:uid(), type:'circle', color, cx:x1, cy:y1, r, lineWidth:2, filled:false }); saveDrawings(); }
    }
    S.shapeStart = null; S.shapeCurrent = null;
  }
});

canvas.addEventListener('mouseleave', () => {
  S.hoverToken = null; hideTooltip();
  document.getElementById('statusCoords').textContent = '—';
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { sx, sy } = getCanvasPos(e);
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  S.ox = sx - (sx - S.ox) * factor;
  S.oy = sy - (sy - S.oy) * factor;
  S.scale = Math.min(4, Math.max(0.15, S.scale * factor));
  document.getElementById('statusZoom').textContent = Math.round(S.scale * 100) + '%';
  markDirty();
}, { passive: false });

// Right-click context menu (DM only)
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!IS_DM) return;
  const { sx, sy } = getCanvasPos(e);
  const wp = sw(sx, sy);
  const hit = hitToken(wp.x, wp.y);
  if (!hit) { hideCtxMenu(); return; }
  S.ctxToken = hit;
  showCtxMenu(e.clientX, e.clientY, hit);
});

document.addEventListener('click', () => hideCtxMenu());

// Space bar for pan mode
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); S.spaceDown = true; wrap.classList.add('tool-pan'); }
  if (e.code === 'KeyV') setTool('select');
  if (e.code === 'KeyM') setTool('measure');
  if (e.code === 'KeyA') setTool('aoe');
  if (e.code === 'KeyP') setTool('pen');
  if (e.code === 'KeyR') setTool('rect');
  if (e.code === 'KeyC') setTool('circle');
  if (e.code === 'Delete' || e.code === 'Backspace') {
    if (e.target !== document.body) return;
    setTool('delete');
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') { S.spaceDown = false; wrap.classList.remove('tool-pan'); }
});

// ── Tooltip ───────────────────────────────────────────────────
function showTooltip(token, cx, cy) {
  const el = document.getElementById('mapTooltip');
  if (!token) { el.style.display = 'none'; return; }
  document.getElementById('ttName').textContent = token.name || '';
  if (token.maxHp != null && (token.type === 'char' || IS_DM)) {
    document.getElementById('ttHp').textContent = `HP: ${token.hp ?? '?'} / ${token.maxHp}`;
  } else {
    document.getElementById('ttHp').textContent = '';
  }
  const conds = token.conditions || [];
  document.getElementById('ttCond').textContent = conds.join(', ');
  el.style.display = 'block';
  el.style.left = (cx + 14) + 'px';
  el.style.top  = (cy + 8)  + 'px';
}
function hideTooltip() { document.getElementById('mapTooltip').style.display = 'none'; }

// ── Context Menu ──────────────────────────────────────────────
function showCtxMenu(cx, cy, token) {
  const menu = document.getElementById('ctxMenu');
  document.getElementById('ctxHp').style.display  = token.type === 'npc' || token.type === 'custom' ? '' : 'none';
  menu.style.display = 'block';
  menu.style.left    = cx + 'px';
  menu.style.top     = cy + 'px';
}
function hideCtxMenu() {
  document.getElementById('ctxMenu').style.display = 'none';
  S.ctxToken = null;
}

document.getElementById('ctxHp').addEventListener('click', e => {
  e.stopPropagation();
  if (!S.ctxToken) return;
  const val = prompt(`HP für ${S.ctxToken.name} (max ${S.ctxToken.maxHp ?? '?'}):`, S.ctxToken.hp ?? '');
  if (val === null) return;
  S.ctxToken.hp = parseInt(val) || 0;
  saveTokens(); markDirty(); hideCtxMenu();
});

document.getElementById('ctxCondition').addEventListener('click', e => {
  e.stopPropagation();
  if (!S.ctxToken) return;
  const val = prompt('Conditions (kommasepariert):', (S.ctxToken.conditions||[]).join(', '));
  if (val === null) return;
  S.ctxToken.conditions = val.split(',').map(s=>s.trim()).filter(Boolean);
  saveTokens(); markDirty(); hideCtxMenu();
});

document.getElementById('ctxRemove').addEventListener('click', e => {
  e.stopPropagation();
  if (!S.ctxToken) return;
  S.tokens = S.tokens.filter(t => t !== S.ctxToken);
  saveTokens(); markDirty(); hideCtxMenu();
});

// ── AoE placement ─────────────────────────────────────────────
function placeAoe(wp) {
  const radiusM = parseFloat(document.getElementById('aoeRadius')?.value) || 5;
  const color   = document.getElementById('aoeColor')?.value || '#FF2D2D';
  const label   = document.getElementById('aoeLabel')?.value || '';
  const r = radiusM * S.gridSize;
  S.drawings.push({ id: uid(), type: 'aoe', cx: wp.x, cy: wp.y, r, color, label, lineWidth: 1.5 });
  saveDrawings();
}

// ── Tool switching ────────────────────────────────────────────
function setTool(tool) {
  S.tool = tool;
  S.drawPath = null; S.shapeStart = null; S.shapeCurrent = null;
  document.querySelectorAll('.map-tool-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  wrap.className = `map-canvas-wrap tool-${tool}`;
  document.getElementById('statusTool').textContent = 'Werkzeug: ' + tool;
}

// ── Status bar ────────────────────────────────────────────────
function updateStatusBar() {
  if (!IS_DM) return;
  document.getElementById('statusTokenCount').textContent = S.tokens.length + ' Tokens';
}

// ── Token Modal ───────────────────────────────────────────────
function openTokenModal() {
  renderTokenPicker();
  document.getElementById('tokenModal').style.display = 'flex';
}
function closeTokenModal() {
  document.getElementById('tokenModal').style.display = 'none';
}

function renderTokenPicker() {
  // Chars
  const cGrid = document.getElementById('tokenPickerChars');
  cGrid.innerHTML = S.chars.map(c => `
    <div class="token-pick-card" data-char-id="${c.id}">
      ${c.image_url
        ? `<img src="${c.image_url}" alt="${c.name}">`
        : `<div class="token-pick-avatar">⚡</div>`}
      <div class="token-pick-name">${c.handle || c.name}</div>
    </div>`).join('');
  cGrid.querySelectorAll('[data-char-id]').forEach(el => {
    el.addEventListener('click', () => {
      const c = S.chars.find(x => x.id === el.dataset.charId);
      if (!c) return;
      addToken({ type:'char', charId:c.id, name:c.handle||c.name, imageUrl:c.image_url||null,
        hp:c.current_hp, maxHp:c.max_hp, conditions: c.conditions||[] });
      closeTokenModal();
    });
  });

  // NPCs
  const nGrid = document.getElementById('tokenPickerNpcs');
  nGrid.innerHTML = S.npcs.map(n => `
    <div class="token-pick-card" data-npc-id="${n.id}">
      ${n.image_url
        ? `<img src="${n.image_url}" alt="${n.name}">`
        : `<div class="token-pick-avatar">👤</div>`}
      <div class="token-pick-name">${n.name}</div>
    </div>`).join('');
  nGrid.querySelectorAll('[data-npc-id]').forEach(el => {
    el.addEventListener('click', () => {
      const n = S.npcs.find(x => x.id === el.dataset.npcId);
      if (!n) return;
      addToken({ type:'npc', npcId:n.id, name:n.name, imageUrl:n.image_url||null,
        hp:n.hp_current, maxHp:n.hp_max, conditions:[] });
      closeTokenModal();
    });
  });
}

function addToken(data) {
  const cx = (-S.ox / S.scale) + (canvas.width / S.scale / 2);
  const cy = (-S.oy / S.scale) + (canvas.height / S.scale / 2);
  const token = { id:uid(), x:snapGrid(cx), y:snapGrid(cy), ...data };
  loadTokenImage(token);
  S.tokens.push(token);
  saveTokens(); markDirty();
}

// Token picker tab switching
document.querySelectorAll('.token-picker-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.token-picker-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tokenPickerChars').style.display  = tab === 'chars'  ? '' : 'none';
    document.getElementById('tokenPickerNpcs').style.display   = tab === 'npcs'   ? '' : 'none';
    document.getElementById('tokenPickerCustom').style.display = tab === 'custom' ? '' : 'none';
  });
});

document.getElementById('customAddBtn').addEventListener('click', () => {
  const label = (document.getElementById('customLabel').value.trim() || '?').slice(0,3);
  const name  = document.getElementById('customName').value.trim()  || 'Custom';
  const color = document.getElementById('customColor').value || '#FF8C00';
  addToken({ type:'custom', label, name, imageUrl:null, color, hp:null, maxHp:null, conditions:[] });
  closeTokenModal();
});

document.getElementById('tokenModalClose').addEventListener('click', closeTokenModal);
document.getElementById('tokenModal').addEventListener('click', e => {
  if (e.target === document.getElementById('tokenModal')) closeTokenModal();
});

// ── DM Controls wiring ────────────────────────────────────────
function setupDmControls() {
  document.getElementById('dmToolbar').style.display    = '';
  document.getElementById('mapControls').style.display  = '';
  document.getElementById('mapStatusBar').style.display = '';

  // Tool buttons
  document.querySelectorAll('.map-tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool));
  });

  // Add token
  document.getElementById('addTokenBtn').addEventListener('click', openTokenModal);

  // Undo draw
  document.getElementById('undoDrawBtn').addEventListener('click', () => {
    if (S.drawings.length) { S.drawings.pop(); saveDrawings(); markDirty(); }
  });

  // Clear drawings
  document.getElementById('clearDrawBtn').addEventListener('click', () => {
    if (!confirm('Alle Zeichnungen löschen?')) return;
    S.drawings = []; saveDrawings(); markDirty();
  });

  // Grid toggle
  document.getElementById('gridToggle').addEventListener('change', e => {
    S.gridEnabled = e.target.checked; saveGrid(); markDirty();
  });

  // Grid size
  document.getElementById('gridSizeSlider').addEventListener('input', e => {
    S.gridSize = parseInt(e.target.value);
    document.getElementById('gridSizeLabel').textContent = S.gridSize + 'px';
    saveGrid(); markDirty();
  });

  // Background upload
  document.getElementById('bgUploadBtn').addEventListener('click', () => {
    document.getElementById('bgFileInput').click();
  });
  document.getElementById('bgFileInput').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const btn = document.getElementById('bgUploadBtn');
    btn.textContent = '⏳ Lade hoch…'; btn.disabled = true;
    try {
      const url = await uploadMapBackground(file);
      S.bgUrl = url;
      loadBackground(url);
      await saveMap({ id: S.mapId, background_url: url });
    } catch(err) { alert('Upload fehlgeschlagen: ' + err.message); }
    btn.textContent = '🖼 Bild hochladen'; btn.disabled = false;
    e.target.value = '';
  });

  // Clear background
  document.getElementById('bgClearBtn').addEventListener('click', async () => {
    S.bgImage = null; S.bgUrl = null;
    await saveMap({ id: S.mapId, background_url: null });
    markDirty();
  });

  // Save map name
  document.getElementById('saveMapNameBtn').addEventListener('click', async () => {
    const name = document.getElementById('mapNameInput').value.trim() || 'Karte';
    S.mapName = name;
    document.getElementById('mapNameDisplay').textContent = name;
    await saveMap({ id: S.mapId, name });
  });

  // Draw color / size sync
  document.getElementById('toolColor').addEventListener('input', e => { S.penColor = e.target.value; });
  document.getElementById('toolSize').addEventListener('input',  e => { S.penWidth = parseInt(e.target.value); });
}

function setupPlayerControls() {
  // Players can drag their own token (handled in mousedown via CHAR_ID check)
}

// ── Utility ───────────────────────────────────────────────────
function uid() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

// ── Boot ──────────────────────────────────────────────────────
async function boot() {
  try {
    const [chars, npcs, combat] = await Promise.all([
      getCharacters(),
      getNpcs(),
      getActiveCombat(),
    ]);
    S.chars          = chars  || [];
    S.npcs           = npcs   || [];
    S.combatSession  = combat?.is_active ? combat : null;

    if (CHAR_ID) {
      S.char = S.chars.find(c => c.id === CHAR_ID) || null;
      if (!S.char) {
        try { S.char = await getCharacter(CHAR_ID); } catch(_) {}
      }
    }

    const mapData = MAP_ID ? await getMap(MAP_ID) : await getLatestMap();
    if (mapData) {
      applyMapData(mapData);
    } else if (IS_DM) {
      const created = await saveMap({ name:'Neue Karte', grid_size:50, grid_enabled:true, tokens:[], drawings:[], background_url:null });
      if (created) applyMapData(created);
    } else {
      document.getElementById('mapLoader').textContent = 'Keine Karte vorhanden.';
      return;
    }

    document.getElementById('mapLoader').style.display = 'none';
    resizeCanvas();

    if (IS_DM) setupDmControls();
    else        setupPlayerControls();

    startRenderLoop();

    // Back link
    const back = document.getElementById('mapBackBtn');
    if (IS_DM) back.href = 'dm.html';
    else if (CHAR_ID) back.href = `player.html?id=${CHAR_ID}`;

    // Realtime
    subscribeMaps(payload => {
      if (S.localDragging) return;
      const m = payload.new;
      if (!m || m.id !== S.mapId) return;
      applyMapData(m);
    });
    subscribeCombat(payload => {
      const cs = payload.new;
      S.combatSession = cs?.is_active ? cs : null;
      markDirty();
    });

    window.addEventListener('resize', resizeCanvas);

  } catch(e) {
    document.getElementById('mapLoader').textContent = 'Fehler: ' + e.message;
    console.error(e);
  }
}

boot();
